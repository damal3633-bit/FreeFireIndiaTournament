<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06061a">
<title>Free Fire India Tournament</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06061a;--bg-gradient:radial-gradient(ellipse at 15% -10%,rgba(124,58,237,.45) 0%,transparent 55%),radial-gradient(ellipse at 85% 5%,rgba(255,60,0,.25) 0%,transparent 50%),radial-gradient(ellipse at 50% 100%,rgba(0,229,255,.12) 0%,transparent 60%),linear-gradient(180deg,#0a0a1f 0%,#06061a 100%);--card-bg-gradient:linear-gradient(145deg,#1e1e42 0%,#16162e 50%,#0b0b1c 100%);--primary:#ff3c00;--primary-glow:rgba(255,60,0,.65);--secondary:#00e5ff;--cyan:#00e5ff;--magenta:#ff00aa;--purple:#a855f7;--text-main:#f4f4ff;--text-muted:#8a8ab0;--border:#2a2a55;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--nav-h:74px;--font-head:'Orbitron',sans-serif;--font-body:'Rajdhani',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg-gradient);background-attachment:fixed;color:var(--text-main);min-height:100vh;font-size:16px;line-height:1.45;overflow-x:hidden;background-color:var(--bg)}
img{max-width:100%;display:block}button,input,select,textarea{font-family:var(--font-body);font-size:15px;font-weight:600}button{cursor:pointer}a{color:var(--secondary);text-decoration:none}
.app{max-width:540px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 40px);min-height:100vh}
#appHeader{position:sticky;top:0;z-index:60;background:linear-gradient(180deg,rgba(10,10,30,.98),rgba(10,10,25,.92));backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,60,0,.25)}
.hdr{max-width:540px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;position:relative;height:70px}
.hdr::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:55%;height:2px;background:linear-gradient(90deg,transparent,var(--primary),var(--magenta),var(--primary),transparent)}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:46px;height:50px;background:linear-gradient(145deg,#1a1a35,#0a0a1c);display:flex;align-items:center;justify-content:center;overflow:hidden;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);border:2px solid var(--primary)}
.logo img{width:100%;height:100%;object-fit:cover}
.brand-name{font-family:var(--font-head);font-size:13px;font-weight:800;letter-spacing:1.2px}
.brand-sub{font-size:9px;font-weight:700;letter-spacing:2.5px;color:var(--secondary);margin-top:2px}
.hdr-actions{display:flex;align-items:center;gap:12px}
.icon-btn{width:42px;height:42px;border:1px solid var(--border);background:linear-gradient(180deg,#22224a,#12122e);display:grid;place-items:center;color:var(--text-main);border-radius:10px}
.icon-btn:active{transform:translateY(2px);border-color:var(--primary)}
.view{display:none;padding:14px 16px 10px}.view.active{display:block;animation:fadeUp .3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card-wrapper{position:relative;margin-bottom:16px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.55))}
.card-wrapper::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--primary),var(--magenta),var(--secondary));border-radius:18px;z-index:-1;opacity:.85}
.card{background:var(--card-bg-gradient);border:1px solid rgba(255,255,255,.05);padding:20px 18px;border-radius:16px;position:relative;overflow:hidden}
.card-hero{background:linear-gradient(135deg,#1a0a2e 0%,#0d0d20 60%,#2a0a1a 100%);border:1px solid rgba(255,60,0,.25)}
.hero-inner{position:relative;z-index:2}
.hero-banner{position:relative;height:170px;margin-bottom:18px;border-radius:18px;background:url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1000&auto=format&fit=crop') center/cover;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;overflow:hidden}
.hero-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(6,6,26,1) 0%,rgba(255,60,0,.25) 55%,transparent 100%)}
.hero-dots{display:flex;gap:8px;position:relative;z-index:2}
.hero-dot{width:32px;height:5px;background:rgba(255,255,255,.25);border-radius:3px}
.hero-dot.active{background:linear-gradient(90deg,var(--primary),var(--magenta))}
.filter-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px}.filter-tabs::-webkit-scrollbar{display:none}
.filter-btn{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#1e1e42,#12122e);border:1px solid var(--border);color:var(--text-muted);padding:9px 18px;border-radius:12px;font-size:12px;font-weight:700;flex:none;font-family:var(--font-head)}
.filter-btn.active{border-color:var(--primary);color:#fff;background:linear-gradient(180deg,#ff5c2a,#d42e00)}
.cyber-card{margin-bottom:18px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.6))}
.cyber-card-bg{background:linear-gradient(135deg,#ff3c00,#a855f7,#00e5ff);border-radius:18px;padding:2px}
.cyber-card-inner{background:linear-gradient(145deg,#1e1e42 0%,#16162e 55%,#0b0b1c 100%);border-radius:16px;display:flex;padding:14px;gap:12px}
.cc-left{width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cc-avatar-wrap{width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,#2a2a55,#12122e);border:2px solid var(--primary);display:flex;align-items:center;justify-content:center}
.cc-avatar-wrap svg{width:40px;height:40px;fill:var(--primary)}
.cc-lines{width:40px;height:6px;background:linear-gradient(90deg,#3a3a6a,#22224a);border-radius:3px}
.cc-mid{flex:1;display:flex;flex-direction:column}
.cc-title{font-family:var(--font-head);font-size:15px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.cc-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.cc-stat-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text-muted)}
.cc-stat-item svg{width:14px;height:14px;fill:var(--primary)}
.cc-progress-wrap{width:100%;height:8px;background:#0a0a1c;border-radius:4px;overflow:hidden;margin-bottom:6px}
.cc-progress{height:100%;background:linear-gradient(90deg,var(--cyan),var(--primary),var(--magenta));border-radius:4px}
.cc-slots{font-size:10px;color:var(--text-muted);font-weight:700}
.cc-btn{margin-top:8px;background:linear-gradient(180deg,#2a2a55,#16162e);border:1px solid var(--border);color:var(--primary);padding:8px 14px;font-size:12px;font-weight:800;border-radius:8px;font-family:var(--font-head)}
.cc-right{width:46px;display:flex;align-items:center;justify-content:center}
.hex-badge{width:44px;height:48px;background:linear-gradient(145deg,#2a2a55,#12122e);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;border:2px solid var(--primary)}
.hex-badge svg{width:22px;height:22px;fill:var(--primary)}
.btn{border:1px solid transparent;border-radius:12px;padding:14px 20px;font-weight:800;font-size:15px;background:linear-gradient(180deg,#2a2a55,#16162e);color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(2px)}
.btn-primary{background:linear-gradient(180deg,#ff8555 0%,#ff3c00 48%,#d42e00 100%);color:#fff;border:none;font-family:var(--font-head)}
.btn-ghost{background:linear-gradient(180deg,#1e1e42,#12122e);border:1px solid var(--border)}
.btn-danger{background:linear-gradient(180deg,#ff5555,#dc2626 50%,#991b1b);color:#fff}
.btn-ok{background:linear-gradient(180deg,#34d399,#10b981 50%,#047857);color:#fff}
.btn-warn{background:linear-gradient(180deg,#fbbf24,#f59e0b 50%,#b45309);color:#fff}
.btn-sm{padding:10px 15px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
#bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:70;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,rgba(16,16,38,.98),rgba(8,8,22,.98));backdrop-filter:blur(20px);border-top:1px solid rgba(255,60,0,.25);display:flex}
.nav-inner{max-width:540px;margin:0 auto;display:flex;width:100%}
.nav-item{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:1.2px;padding:8px 0;position:relative;font-family:var(--font-head)}
.nav-item svg{fill:var(--text-muted);width:24px;height:24px}
.nav-item.active{color:var(--primary)}
.nav-item.active svg{fill:var(--primary);transform:translateY(-2px) scale(1.1)}
.nav-item.active::before{content:"";position:absolute;top:0;width:36px;height:3px;background:linear-gradient(90deg,var(--cyan),var(--primary),var(--magenta));border-radius:0 0 3px 3px}
.empty{text-align:center;padding:34px 16px;color:var(--text-muted)}
.empty-ic{width:64px;height:64px;background:linear-gradient(145deg,#2a2a55,#12122e);display:grid;place-items:center;margin:0 auto 12px;color:var(--primary);border:1px solid var(--border);border-radius:16px}
.empty-t{font-weight:700;font-size:15px;margin-bottom:4px}
.empty-s{font-size:13px;font-weight:600}
.avatar{border-radius:50%;object-fit:cover;border:2px solid var(--primary);flex:none}
.avatar-txt{display:grid;place-items:center;background:linear-gradient(145deg,#2a2a55,#12122e);color:var(--primary);font-weight:800}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--border);padding:12px 10px;text-align:center;border-radius:12px}
.stat-v{font-family:var(--font-head);font-size:19px;font-weight:800}
.stat-l{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);margin-top:4px}
.stat-card{background:linear-gradient(145deg,#1e1e42,#12122e);border:1px solid var(--border);padding:14px 10px;text-align:center;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;font-size:11px;font-weight:800;text-transform:uppercase;border:1px solid transparent;border-radius:8px}
.chip-blue{background:rgba(255,60,0,.15);border-color:rgba(255,60,0,.4);color:var(--primary)}
.chip-green{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:var(--ok)}
.chip-orange{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:var(--warn)}
.chip-red{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:var(--bad)}
.chip-gray{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:var(--text-muted)}
.field{margin-bottom:14px}.label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.input{width:100%;padding:13px 16px;border:1px solid var(--border);background:linear-gradient(180deg,#0a0a1c,#12122e);color:var(--text-main);outline:none;border-radius:10px}
.input:focus{border-color:var(--primary)}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 14px}
.sec-title{font-family:var(--font-head);font-size:15px;font-weight:700;letter-spacing:1.2px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.sec-link{font-size:13px;font-weight:700;color:var(--secondary);font-family:var(--font-head)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.center{text-align:center}.muted{color:var(--text-muted)}.small{font-size:12px}.bold{font-weight:800}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:14px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:540px;background:linear-gradient(180deg,#1a1a3a,#0d0d20);padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;border-top-left-radius:22px;border-top-right-radius:22px;border-top:2px solid var(--primary)}
.modal-head{font-family:var(--font-head);font-size:18px;font-weight:800;margin-bottom:14px;color:var(--primary);text-transform:uppercase;letter-spacing:1px}
.modal-body{font-size:14px;line-height:1.65;white-space:pre-line}
.modal-foot{display:flex;gap:10px;margin-top:18px}.modal-foot .btn{flex:1}
.grabber{width:44px;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--magenta));margin:-6px auto 16px}
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px 18px 40px;max-width:540px;margin:0 auto}
.auth-logo{width:110px;height:126px;background:linear-gradient(145deg,#1a1a3a,#0a0a1c);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto 20px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);border:3px solid var(--primary)}
.auth-logo img{width:100%;height:100%;object-fit:cover}
.auth-title{font-family:var(--font-head);text-align:center;font-size:25px;font-weight:800;letter-spacing:2px;margin-bottom:6px;text-transform:uppercase}
.auth-sub{text-align:center;font-size:13px;font-weight:700;letter-spacing:4px;color:var(--secondary);margin-bottom:24px;text-transform:uppercase}
.tabs{display:flex;background:linear-gradient(180deg,#0a0a1c,#12122e);border:1px solid var(--border);padding:5px;margin-bottom:18px;border-radius:12px}
.tab{flex:1;border:none;background:none;padding:11px;font-weight:700;font-size:14px;color:var(--text-muted);text-transform:uppercase;font-family:var(--font-head);border-radius:8px}
.tab.active{background:linear-gradient(180deg,#ff5c2a,#d42e00);color:#fff}
.admin-top{background:linear-gradient(135deg,#2a0a3a,#0d0d20);padding:18px 16px 20px;margin:-14px -16px 14px;border-bottom:1px solid rgba(255,60,0,.3)}
.admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}.admin-tabs::-webkit-scrollbar{display:none}
.atab{flex:none;border:1px solid var(--border);background:linear-gradient(180deg,#1e1e42,#12122e);color:var(--text-main);padding:9px 15px;font-weight:700;font-size:13px;white-space:nowrap;border-radius:10px;font-family:var(--font-head);position:relative}
.atab.active{background:linear-gradient(180deg,#ff8555,#ff3c00 50%,#d42e00);color:#fff;border-color:transparent}
.atab .badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px;min-width:18px;text-align:center}
.mini-table{width:100%;border-collapse:collapse;font-size:13px}
.mini-table th{text-align:left;color:var(--text-muted);font-size:11px;text-transform:uppercase;padding:7px 6px;border-bottom:1px solid var(--border)}
.mini-table td{padding:9px 6px;border-bottom:1px solid var(--border);font-weight:600;vertical-align:middle}
.notice{border-radius:12px;padding:13px 15px;font-size:13px;font-weight:600;line-height:1.5;border:1px dashed;margin-bottom:14px}
.notice-warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.5);color:var(--warn)}
.notice-info{background:rgba(255,60,0,.1);border-color:rgba(255,60,0,.5);color:var(--primary)}
.notice-bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.5);color:var(--bad)}
.notice-ok{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.5);color:var(--ok)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none;padding-bottom:0}.list-row:first-child{padding-top:0}
.list-main{flex:1;min-width:0}
.list-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-badge{width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(145deg,#2a2a55,#12122e);color:var(--text-muted);flex:none;border:1px solid var(--border);border-radius:8px}
.rank-1{background:linear-gradient(180deg,#ffb347,#ff8c00 50%,#d42e00);color:#fff;border:none}
.rank-2{background:linear-gradient(180deg,#d0d5dd,#9ca3af 50%,#4b5563);color:#fff;border:none}
.rank-3{background:linear-gradient(180deg,#d97706,#b45309 50%,#78350f);color:#fff;border:none}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));z-index:80;width:58px;height:58px;border:1px solid var(--primary);background:linear-gradient(180deg,#ff8555,#ff3c00 50%,#d42e00);color:#fff;display:grid;place-items:center;border-radius:50%}
.countdown-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 12px;background:linear-gradient(180deg,#1e1e42,#12122e);border:1px solid var(--border);border-radius:8px}
.countdown-chip.far{color:var(--secondary);border-color:rgba(0,229,255,.4)}
.countdown-chip.near{color:var(--warn);border-color:rgba(245,158,11,.5)}
.countdown-chip.soon{color:#fff;background:linear-gradient(180deg,#ff5c2a,#d42e00);border-color:var(--primary)}
.countdown-chip.completed{color:var(--ok);border-color:rgba(16,185,129,.5)}
.countdown-chip.live{color:#fff;background:linear-gradient(180deg,#ef4444,#991b1b);border-color:#ef4444}
.countdown-chip.starting{color:#fff;background:linear-gradient(180deg,#f59e0b,#b45309);border-color:#f59e0b}
.countdown-grid{display:flex;justify-content:center;gap:8px;align-items:center;font-family:var(--font-head)}
.cd-unit{background:linear-gradient(180deg,#2a2a55,#12122e);padding:6px 10px;border-radius:8px;border:1px solid var(--border);min-width:48px;text-align:center}
.cd-num{font-size:20px;font-weight:800;color:var(--primary);line-height:1}
.cd-lbl{font-size:9px;color:var(--text-muted);letter-spacing:1px;margin-top:3px;font-weight:700}
.cd-sep{color:var(--primary);font-size:18px;font-weight:800}
.cd-live-big{color:#ef4444;font-weight:800;font-size:16px;letter-spacing:2px}
.cd-completed{color:var(--ok);font-weight:800;font-size:16px;letter-spacing:2px}
.cd-tba{color:var(--text-muted);font-size:14px;letter-spacing:2px}
.cd-starting{color:var(--warn);font-weight:800}
.room-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:linear-gradient(145deg,#0a0a1c,#12122e);border:1px dashed var(--primary);padding:12px;border-radius:12px;margin-top:8px}
.room-box .lbl{font-size:10px;color:var(--secondary);font-weight:700;letter-spacing:1px;margin-bottom:3px}
.room-box .val{font-size:15px;font-weight:800;font-family:monospace}
.ss-preview-box{background:linear-gradient(145deg,#0a0a1c,#12122e);border:1px dashed var(--primary);padding:10px;border-radius:12px;text-align:center;margin-top:8px}
.ss-preview-box img{max-width:100%;max-height:320px;border-radius:8px;margin:0 auto;display:block}
</style>
</head>
<body>

<header id="appHeader" style="display:none">
  <div class="hdr">
    <div class="brand">
      <div class="logo"><img src="logo.jpg" alt="FF" onerror="this.style.display='none';this.parentElement.innerHTML='FF';"></div>
      <div><div class="brand-name">FREE FIRE</div><div class="brand-sub">INDIA</div></div>
    </div>
    <div class="hdr-actions">
      <button class="icon-btn" onclick="go('profile')" id="hdrAvatar" style="padding:0;overflow:hidden"></button>
    </div>
  </div>
</header>

<div class="app" id="appMain">
  <section class="view" id="view-auth">
    <div class="auth-wrap">
      <div class="auth-logo"><img src="logo.jpg" alt="FF" onerror="this.style.display='none';this.parentElement.innerHTML='FF';"></div>
      <div class="auth-title">FREE FIRE INDIA</div>
      <div class="auth-sub">Tournament Arena</div>
      <div class="card-wrapper"><div class="card">
        <div class="tabs">
          <button class="tab active" id="tabLogin" onclick="setAuthTab('login')">Login</button>
          <button class="tab" id="tabRegister" onclick="setAuthTab('register')">Register</button>
        </div>
        <div id="authLoginForm">

function resizeImage(file,maxDim,cb){
  const r=new FileReader();
  r.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){if(w>=h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>cb(null);
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

function parseTournamentStart(t){if(!t||!t.date||!t.time)return null;const d=new Date(t.date+'T'+(t.time.length===5?t.time+':00':t.time));return isNaN(d.getTime())?null:d;}
function getCountdownChip(t){
  if(!t)return{html:'—',stateClass:'empty'};
  if(t.status==='Completed')return{html:'✓ COMPLETED',stateClass:'completed'};
  if(t.status==='Live')return{html:'🔴 LIVE NOW',stateClass:'live'};
  const start=parseTournamentStart(t);if(!start)return{html:'⏱ TIME TBA',stateClass:'empty'};
  const diff=start.getTime()-Date.now();if(diff<=0)return{html:'⚡ STARTING SOON',stateClass:'starting'};
  const days=Math.floor(diff/86400000),hours=Math.floor((diff%86400000)/3600000),minutes=Math.floor((diff%3600000)/60000),seconds=Math.floor((diff%60000)/1000);
  if(days>0)return{html:'⏱ '+days+'d '+pad2(hours)+'h '+pad2(minutes)+'m',stateClass:'far'};
  if(hours>0)return{html:'⏱ '+pad2(hours)+':'+pad2(minutes)+':'+pad2(seconds),stateClass:'near'};
  return{html:'⏱ '+pad2(minutes)+':'+pad2(seconds),stateClass:'soon'};
}
function getCountdownBig(t){
  if(!t)return{html:'<div class="cd-tba">TIME TBA</div>',stateClass:''};
  if(t.status==='Completed')return{html:'<div class="cd-completed">✓ COMPLETED</div>',stateClass:''};
  if(t.status==='Live')return{html:'<div class="cd-live-big">🔴 LIVE NOW</div>',stateClass:'live'};
  const start=parseTournamentStart(t);if(!start)return{html:'<div class="cd-tba">TIME TBA</div>',stateClass:''};
  const diff=start.getTime()-Date.now();if(diff<=0)return{html:'<div class="cd-starting">⚡ STARTING SOON</div>',stateClass:'starting'};
  const days=Math.floor(diff/86400000),hours=Math.floor((diff%86400000)/3600000),minutes=Math.floor((diff%3600000)/60000),seconds=Math.floor((diff%60000)/1000);
  const units=[];if(days>0)units.push({n:pad2(days),l:'DAYS'});
  units.push({n:pad2(hours),l:'HRS'},{n:pad2(minutes),l:'MIN'},{n:pad2(seconds),l:'SEC'});
  const html=units.map((u,i)=>(i>0?'<div class="cd-sep">:</div>':'')+'<div class="cd-unit"><div class="cd-num">'+u.n+'</div><div class="cd-lbl">'+u.l+'</div></div>').join('');
  return{html,stateClass:days>0?'far':(hours>0?'near':'soon')};
}
function screenshotWindowOpen(t){if(!t)return false;if(t.status==='Completed')return false;if(t.status==='Live')return true;const start=parseTournamentStart(t);return start?Date.now()>=start.getTime()+60000:false;}
function updateAllCountdowns(){

    else{const mm=Math.floor(diff/60000),ss=Math.floor((diff%60000)/1000);el.textContent='⏱ Opens in '+pad2(mm)+':'+pad2(ss);}
  });
  document.querySelectorAll('[data-cd-tid]').forEach(el=>{
    const t=tournamentById(el.getAttribute('data-cd-tid'));if(!t)return;
    const cd=getCountdownChip(t);el.innerHTML=cd.html;el.className='countdown-chip '+cd.stateClass;
  });
  document.querySelectorAll('[data-cd-big-tid]').forEach(el=>{
    const t=tournamentById(el.getAttribute('data-cd-big-tid'));if(!t)return;
    const cd=getCountdownBig(t);el.innerHTML=cd.html;el.className='countdown-grid '+cd.stateClass;
  });
}

async function directLogin(){

  toast('Connecting to Cloud...','info');
  try{
    const snap=await db.collection('users').where('mobile','==',mobile).get();
    if(snap.empty)return toast('No account found. Please register.','bad');
    const userDoc=snap.docs[0];
    const user={id:userDoc.id,...userDoc.data()};
    if(user.blocked)return toast('Account blocked by admin.','bad');
    if(user.passwordHash!==hashPassword(pwd))return toast('Incorrect password.','bad');
    session={userId:user.id};saveSession();
    toast('Welcome back, '+user.name.split(' ')[0]+'!','ok');
    if(isAdminUser(user))go('admin');else go('home');

}

function go(view,param){
  if(!currentUser()&&view!=='auth')view='auth';

}
function updateHeader(){const u=currentUser();if(!u)return;$('#hdrAvatar').innerHTML=avatarHTML(u,38);}
function renderView(view){

    case 'matches':renderMatches();break;
    case 'wallet':renderWallet();break;

function avatarHTML(user,size){
  size=size||44;
  if(user&&user.photo)return '<img class="avatar" style="width:'+size+'px;height:'+size+'px" src="'+user.photo+'">';
  const nm=(user&&user.name?user.name:'G').trim();
  const initials=nm.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return '<div class="avatar avatar-txt" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.36)+'px">'+esc(initials)+'</div>';
}
function myRegistrations(){const u=currentUser();return u?DB.registrations.filter(r=>r.userId===u.id):[];}
function isRegistered(tid){return myRegistrations().some(r=>r.tournamentId===tid);}

    if(state.view==='wallet')renderWallet();

  db.collection('tournaments').onSnapshot(snap=>{
    DB.tournaments=snap.docs.map(d=>({id:d.id,...d.data()}));

  },err=>console.error('registrations:',err));

  db.collection('leaderboard').onSnapshot(snap=>{
    DB.leaderboard=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(state.view==='leaderboard')renderLeaderboard();
    if(state.view==='home')renderHome();

  db.collection('walletTransactions').onSnapshot(snap=>{

    if(state.view==='wallet')renderWallet();
    if(state.view==='history')renderHistory();

  db.collection('paymentRequests').onSnapshot(snap=>{
    DB.paymentRequests=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(state.view==='admin')renderAdmin();
    if(state.view==='wallet')renderWallet();
  },err=>{console.error('payments:',err);toast('Payment sync error','bad');});

  db.collection('screenshots').onSnapshot(snap=>{
    DB.screenshots=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(state.view==='admin'&&state.adminTab==='screenshots')renderAdmin();
  },err=>console.error('screenshots:',err));

  db.collection('announcements').onSnapshot(snap=>{
    DB.announcements=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(state.view==='admin'&&state.adminTab==='content')renderAdmin();
  },err=>console.error('announcements:',err));

  db.collection('adminLogs').orderBy('time','desc').limit(50).onSnapshot(snap=>{
    DB.adminLogs=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(state.view==='admin'&&state.adminTab==='dashboard')renderAdmin();
  },err=>console.error('adminLogs:',err));

function renderTournaments(){
  const filters=['All','Solo','Duo','Squad','Free','Paid','Live'];
  let list=DB.tournaments.slice();
  const f=state.tFilter;
  if(f==='Solo'||f==='Duo'||f==='Squad')list=list.filter(t=>t.mode===f);
  else if(f==='Free')list=list.filter(t=>t.entryType==='Free');
  else if(f==='Paid')list=list.filter(t=>t.entryType==='Paid');
  else if(f==='Live')list=list.filter(t=>t.status==='Live');
  list.sort((a,b)=>{const order={Live:0,Upcoming:1,Completed:2};if(order[a.status]!==order[b.status])return order[a.status]-order[b.status];return new Date(a.date+'T'+a.time)-new Date(b.date+'T'+b.time);});
  let html='<div class="sec-head" style="margin-top:2px"><div class="sec-title">'+icon('trophy',20)+' TOURNAMENTS</div><span class="chip chip-blue">'+list.length+' EVENTS</span></div>';

}

async function joinTournament(id){
  const u=currentUser(),t=tournamentById(id);if(!u||!t)return;
  if(u.blocked)return toast('Account blocked.','bad');
  if(t.status==='Completed')return toast('Completed.','bad');
  if(isRegistered(t.id))return toast('Already joined.','bad');
  if(t.joined>=t.slots)return toast('All slots full.','bad');
  const fee=t.entryType==='Paid'?(t.entryFee||0):0;
  if(fee>0&&u.availCoins<fee)return toast('Insufficient balance.','bad');
  const msg=fee>0?'Joining "'+t.name+'" will deduct ₹'+fee+'.':'Join "'+t.name+'" on '+fmtDate(t.date)+' at '+fmtTime(t.time)+'. Free entry.';
  confirmAction('Join Tournament?',msg,async()=>{
    try{
      if(fee>0){
        await db.collection('users').doc(u.id).update({availCoins:firebase.firestore.FieldValue.increment(-fee)});
        await db.collection('walletTransactions').add({userId:u.id,type:'Entry Fee',title:'Entry — '+t.name,amount:fee,status:'Completed',time:nowISO()});
      }
      await db.collection('registrations').add({tournamentId:t.id,userId:u.id,playerName:u.name,gameName:u.gameName,ffUid:u.ffUid,status:'Confirmed',createdAt:nowISO()});
      await db.collection('tournaments').doc(t.id).update({joined:firebase.firestore.FieldValue.increment(1)});
      logAdmin('Player '+u.gameName+' joined '+t.name);
      toast('Joined!','ok');
      if(state.view==='details')renderDetails();else if(state.view==='home')renderHome();else if(state.view==='tournaments')renderTournaments();
    }catch(e){console.error(e);toast('Failed to join: '+e.message,'bad');}
  },fee>0?'PAY ₹'+fee+' & JOIN':'JOIN NOW');
}

      const canSeeRoom=roomVisible(t);

    }).join('');
    return s;
  }
  if(!tours.length){html+=emptyHTML('target','No matches joined yet','Browse and join your first match.');html+='<button class="btn btn-primary btn-block mt12" onclick="go(\'tournaments\')">BROWSE TOURNAMENTS</button>';}
  else{html+=section('LIVE MATCHES',live,'chip-red');html+=section('UPCOMING MATCHES',upcoming,'chip-blue');html+=section('COMPLETED MATCHES',done,'chip-green');}

function openScreenshotUpload(tid){
  const t=tournamentById(tid);if(!t)return;
  const u=currentUser();if(!u)return;
  if(!isRegistered(tid))return toast('Not registered.','bad');
  if(!screenshotWindowOpen(t))return toast('Upload not open yet.','bad');
  openModal('<div class="modal-head">📸 SUBMIT SCREENSHOT</div><div class="modal-body">Tournament: <b>'+esc(t.name)+'</b><br>Player: '+esc(u.gameName)+'</div><div class="field mt12"><label class="label">Screenshot (JPG/PNG)</label><input type="file" accept="image/*" class="input" style="padding:10px" id="ssFile" onchange="previewScreenshot(this)"></div><div id="ssPreview"></div><div class="small muted mt8">Admin এর Gmail ও Google Drive এ save হবে।</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">CANCEL</button><button class="btn btn-primary" onclick="doSubmitScreenshot(\''+tid+'\')">SUBMIT</button></div>');
}
function previewScreenshot(input){
  const f=input.files&&input.files[0],box=document.getElementById('ssPreview');
  if(!f||!box)return;
  if(!/^image\//.test(f.type)){box.innerHTML='';return toast('Images only','bad');}
  if(f.size>12*1024*1024){box.innerHTML='';return toast('Max 12MB','bad');}
  const url=URL.createObjectURL(f);
  box.innerHTML='<div class="ss-preview-box"><img src="'+url+'"></div>';
}
function doSubmitScreenshot(tid){
  const input=document.getElementById('ssFile');
  const f=input&&input.files&&input.files[0];
  if(!f)return toast('Select a screenshot','bad');
  const u=currentUser(),t=tournamentById(tid);if(!u||!t)return;
  const btn=document.querySelector('.modal-foot .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='PROCESSING...';}
  toast('Compressing…','info');
  resizeImage(f,900,(base64)=>{
    if(!base64){if(btn){btn.disabled=false;btn.textContent='SUBMIT';}return toast('Could not read image','bad');}
    const filename='ff_'+(u.gameName||'player').replace(/[^a-zA-Z0-9]/g,'')+'_'+Date.now()+'.jpg';
    db.collection('screenshots').add({tournamentId:tid,tournamentName:t.name,userId:u.id,playerName:u.name,gameName:u.gameName,ffUid:u.ffUid,filename,time:nowISO(),synced:false,image:base64}).then(ref=>{
      closeModal();toast('Uploading to Drive…','info');
      sendToWebhook({type:'screenshot',playerName:u.name,gameName:u.gameName,ffUid:u.ffUid,tournamentName:t.name,filename,image:base64}).then(r=>{
        if(r.ok){db.collection('screenshots').doc(ref.id).update({synced:true}).catch(()=>{});toast('✅ Sent to Gmail + Drive','ok');}
        else if(r.reason==='not_configured')toast('⚠ Webhook not configured','info');
        else toast('⚠ Webhook upload failed','bad');
      });
      if(state.view==='details'&&state.param===tid)renderDetails();
      else if(state.view==='matches')renderMatches();
    }).catch(err=>{console.error(err);if(btn){btn.disabled=false;btn.textContent='SUBMIT';}toast('Failed: '+err.message,'bad');});
  });
}

  openModal('<div class="modal-head">DEPOSIT MONEY</div><div class="modal-body">Minimum ₹10.</div><div class="field mt12"><label class="label">Amount (₹)</label><input class="input" id="depAmount" type="number" min="10" max="100000"></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">CANCEL</button><button class="btn btn-primary" onclick="depositStep2()">PROCEED</button></div>');
}
function depositStep2(){
  const amt=parseInt($('#depAmount').value,10);
  if(!amt||amt<10)return toast('Min ₹10','bad');
  if(amt>100000)return toast('Max ₹1,00,000','bad');
  const upiUri='upi://pay?pa='+encodeURIComponent(UPI_ID)+'&pn='+encodeURIComponent(UPI_NAME)+'&am='+amt+'&cu=INR';
  const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(upiUri);
  openModal('<div class="modal-head">PAY ₹'+amt+' VIA UPI</div><div style="text-align:center;padding:12px;background:#fff;border-radius:12px;margin-bottom:12px;"><img src="'+qrUrl+'" style="width:200px;height:200px;margin:0 auto;" onerror="this.style.display=\'none\'"></div><div style="font-family:monospace;font-size:16px;font-weight:800;background:linear-gradient(180deg,#0a0a1c,#12122e);border:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:10px;"><span>'+UPI_ID+'</span><button style="background:none;border:none;color:var(--primary);font-weight:800;" onclick="copyUpi()">COPY</button></div><div class="small muted mt8" style="text-align:center">Scan QR or pay. Then enter UTR below.</div><div class="field mt12"><label class="label">UTR / Reference</label><input class="input" id="depUtr" maxlength="30"></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">CANCEL</button><button class="btn btn-primary" onclick="submitDeposit('+amt+')">SUBMIT</button></div>');
}
function copyUpi(){if(navigator.clipboard)navigator.clipboard.writeText(UPI_ID).then(()=>toast('Copied','ok')).catch(()=>toast(UPI_ID,'info'));else toast(UPI_ID,'info');}

async function submitDeposit(amt){
  const utr=$('#depUtr').value.trim();
  if(utr.length<6)return toast('Enter valid UTR','bad');
  const u=currentUser();if(!u)return;
  const btn=document.querySelector('.modal-foot .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='SUBMITTING...';}
  try{
    // 1. Create wallet transaction first
    const txRef=await db.collection('walletTransactions').add({
      userId:u.id,type:'Deposit',
      title:'Deposit (UTR: '+utr+')',
      amount:amt,status:'Processing',time:nowISO()
    });
    // 2. Create payment request
    await db.collection('paymentRequests').add({
      userId:u.id,type:'Deposit',amount:amt,utr,
      status:'Processing',createdAt:nowISO(),processedAt:'',adminNote:'',
      walletTxId:txRef.id
    });
    closeModal();
    toast('✅ Deposit request submitted! Admin will verify.','ok');
    logAdmin('Deposit ₹'+amt+' from '+u.gameName);
    // 3. Send webhook (non-blocking)
    sendToWebhook({type:'deposit',amount:amt,utr,userName:u.name,gameName:u.gameName,ffUid:u.ffUid,mobile:u.mobile}).then(r=>{
      if(r.ok)toast('📧 Admin email sent','ok');
    }).catch(()=>{});
  }catch(e){
    console.error('Deposit error:',e);
    if(btn){btn.disabled=false;btn.textContent='SUBMIT';}
    toast('❌ Failed: '+e.message,'bad');
  }
}

function openWithdrawModal(){
  const u=currentUser();if(!u)return;
  if(u.availCoins<10)return toast('Min ₹10 required','bad');
  openModal('<div class="modal-head">WITHDRAW MONEY</div><div class="modal-body">Balance: <strong>₹'+u.availCoins+'</strong><br>Min ₹10. Amount will be deducted immediately and refunded if rejected.</div><div class="field mt12"><label class="label">Amount (₹)</label><input class="input" id="wdAmount" type="number" min="10" max="'+u.availCoins+'"></div><div class="tabs" style="margin-bottom:12px"><button class="tab active" id="wdTabUpi" onclick="setWdTab(\'upi\')">UPI</button><button class="tab" id="wdTabBank" onclick="setWdTab(\'bank\')">Bank</button></div><div id="wdUpiFields"><div class="field"><label class="label">UPI ID</label><input class="input" id="wdUpi" maxlength="50"></div></div><div id="wdBankFields" style="display:none"><div class="field"><label class="label">Account Number</label><input class="input" id="wdAccNo" maxlength="20" inputmode="numeric"></div><div class="field"><label class="label">IFSC</label><input class="input" id="wdIfsc" maxlength="11" style="text-transform:uppercase"></div><div class="field"><label class="label">Bank Name</label><input class="input" id="wdBankName" maxlength="40"></div></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">CANCEL</button><button class="btn btn-primary" onclick="submitWithdrawal()">SUBMIT</button></div>');

function setWdTab(tab){$('#wdTabUpi').classList.toggle('active',tab==='upi');$('#wdTabBank').classList.toggle('active',tab==='bank');$('#wdUpiFields').style.display=tab==='upi'?'block':'none';$('#wdBankFields').style.display=tab==='bank'?'block':'none';}

async function submitWithdrawal(){
  const u=currentUser();if(!u)return;
  const amt=parseInt($('#wdAmount').value,10);
  const method=$('#wdTabBank').classList.contains('active')?'bank':'upi';
  if(!amt||amt<10)return toast('Min ₹10','bad');
  if(amt>u.availCoins)return toast('Insufficient','bad');
  let reqData,title;
  if(method==='upi'){const upi=$('#wdUpi').value.trim();if(!upi||upi.indexOf('@')===-1)return toast('Valid UPI ID','bad');reqData={withdrawMethod:'upi',upiId:upi};title='Withdrawal to UPI '+upi;}
  else{const accNo=$('#wdAccNo').value.trim(),ifsc=$('#wdIfsc').value.trim().toUpperCase(),bankName=$('#wdBankName').value.trim();if(!accNo||accNo.length<6)return toast('Valid account','bad');if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc))return toast('Valid IFSC','bad');if(!bankName||bankName.length<2)return toast('Bank name','bad');reqData={withdrawMethod:'bank',bankAccNo:accNo,bankIfsc:ifsc,bankName};title='Withdrawal to '+bankName+' (A/C '+accNo.slice(-4)+')';}
  const btn=document.querySelector('.modal-foot .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='SUBMITTING...';}
  try{
    // 1. Deduct immediately to prevent over-withdrawal
    await db.collection('users').doc(u.id).update({availCoins:firebase.firestore.FieldValue.increment(-amt)});
    // 2. Create wallet transaction
    const txRef=await db.collection('walletTransactions').add({
      userId:u.id,type:'Withdrawal',title,amount:amt,
      status:'Processing',time:nowISO(),withdrawMethod:method
    });
    // 3. Create payment request
    await db.collection('paymentRequests').add(Object.assign({
      userId:u.id,type:'Withdrawal',amount:amt,
      status:'Processing',createdAt:nowISO(),processedAt:'',adminNote:'',
      walletTxId:txRef.id
    },reqData));
    closeModal();
    toast('✅ Withdrawal request submitted! Admin will verify.','ok');
    logAdmin('Withdrawal ₹'+amt+' via '+method+' from '+u.gameName);
    // 4. Send webhook (non-blocking)
    sendToWebhook({type:'withdrawal',amount:amt,method,upiId:reqData.upiId||'',bankDetails:reqData.withdrawMethod==='bank'?{bankAccNo:reqData.bankAccNo,bankIfsc:reqData.bankIfsc,bankName:reqData.bankName}:null,userName:u.name,gameName:u.gameName,ffUid:u.ffUid,mobile:u.mobile}).then(r=>{
      if(r.ok)toast('📧 Admin email sent','ok');
    }).catch(()=>{});
  }catch(e){
    console.error('Withdrawal error:',e);
    if(btn){btn.disabled=false;btn.textContent='SUBMIT';}
    toast('❌ Failed: '+e.message,'bad');
  }
}

function onPhotoPick(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(!/^image\//.test(f.type))return toast('Select image','bad');
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=async()=>{
      const size=180,c=document.createElement('canvas');c.width=size;c.height=size;
      const ctx=c.getContext('2d');const m=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);
      const base64=c.toDataURL('image/jpeg',0.72);
      const u=currentUser();
      try{await db.collection('users').doc(u.id).update({photo:base64});toast('Photo updated','ok');updateHeader();}
      catch(err){toast('Failed: '+err.message,'bad');}
    };
    img.onerror=()=>toast('Could not read','bad');
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}
async function saveProfile(){
  const u=currentUser();
  const name=$('#pfName').value.trim(),game=$('#pfGame').value.trim(),ffUid=$('#pfUid').value.trim();
  if(name.length<2)return toast('Name min 2','bad');
  if(game.length<2)return toast('Game name min 2','bad');
  if(!/^\d{6,12}$/.test(ffUid))return toast('FF UID 6-12 digits','bad');
  try{
    const snap=await db.collection('users').where('ffUid','==',ffUid).get();
    if(!snap.empty&&snap.docs[0].id!==u.id)return toast('UID used by another player','bad');
    await db.collection('users').doc(u.id).update({name,gameName:game,ffUid});
    toast('Profile saved','ok');updateHeader();
  }catch(e){toast('Failed: '+e.message,'bad');}
}

function adminPayments(){
  const isOpen=(s)=>s==='Pending'||s==='Processing';
  const open=DB.paymentRequests.filter(p=>isOpen(p.status)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const history=DB.paymentRequests.filter(p=>!isOpen(p.status)).sort((a,b)=>new Date(b.processedAt||b.createdAt)-new Date(a.processedAt||a.createdAt)).slice(0,30);

async function adminPaymentAction(id,action){
  const p=DB.paymentRequests.find(x=>x.id===id);
  if(!p)return toast('Request not found','bad');
  if(p.status==='Approved'||p.status==='Rejected')return toast('Already processed','bad');
  const u=DB.users.find(x=>x.id===p.userId);
  if(!u)return toast('User not found','bad');

  confirmAction(action==='Approved'?'Approve '+(p.type==='Deposit'?'Deposit':'Withdrawal')+'?':'Reject request?',p.type+' ₹'+p.amount+' for '+u.gameName,async()=>{
    try{
      if(action==='Approved'){
        // Approve: for deposit, ADD balance. For withdrawal, balance already deducted.
        if(p.type==='Deposit'){
          await db.collection('users').doc(u.id).update({availCoins:firebase.firestore.FieldValue.increment(p.amount)});
        }
        // Update payment request
        await db.collection('paymentRequests').doc(id).update({status:'Approved',processedAt:nowISO()});
        // Update linked wallet transaction
        if(p.walletTxId){
          await db.collection('walletTransactions').doc(p.walletTxId).update({status:'Completed'});
        }
        toast('✅ Approved — balance updated','ok');
        logAdmin('APPROVED '+p.type+' ₹'+p.amount+' for '+u.gameName);
      }else{
        // Reject: for withdrawal, REFUND balance (was deducted on request). For deposit, nothing to refund.
        if(p.type==='Withdrawal'){
          await db.collection('users').doc(u.id).update({availCoins:firebase.firestore.FieldValue.increment(p.amount)});
        }
        // Update payment request
        await db.collection('paymentRequests').doc(id).update({status:'Rejected',processedAt:nowISO()});
        // Update linked wallet transaction
        if(p.walletTxId){
          await db.collection('walletTransactions').doc(p.walletTxId).update({status:'Rejected'});
        }
        toast('❌ Rejected'+(p.type==='Withdrawal'?' — refunded':'')+'','info');
        logAdmin('REJECTED '+p.type+' ₹'+p.amount+' for '+u.gameName);
      }
      // Force re-render
      setTimeout(()=>{if(state.view==='admin')renderAdmin();if(state.view==='wallet')renderWallet();},400);
    }catch(e){
      console.error('Payment action:',e);
      toast('❌ Failed: '+e.message,'bad');
    }
  },action==='Approved'?'APPROVE':'REJECT',action!=='Approved');
}

function resultPlayerListHTML(){
  const tid=state.resTourId;
  if(!tid)return '<div class="empty" style="padding:18px"><div class="empty-s">Select a tournament above.</div></div>';
  const t=tournamentById(tid);if(!t)return '';
  const rate=t.killRate||0;
  if(!state.resultDraft.length)return '<div class="empty" style="padding:18px"><div class="empty-s">No players registered.</div></div>';
  const hasExisting=DB.results.some(r=>r.tournamentId===tid);
  let html='';
  if(hasExisting)html+='<div class="notice notice-bad" style="margin-bottom:10px">⚠️ Already published.</div>';

  state.resultDraft.forEach((d,i)=>{const payment=d.kills*rate;html+='<tr><td><div class="list-title" style="font-size:13px">'+esc(d.gameName)+'</div><div class="list-sub" style="font-size:11px">UID '+esc(d.ffUid)+'</div></td><td><input class="input" style="padding:5px;text-align:center;" id="kills_'+i+'" type="number" min="0" max="999" value="'+d.kills+'" oninput="updateDraftKills('+i+',this.value)"></td><td><input class="input" style="padding:5px;text-align:center;" id="pts_'+i+'" type="number" min="0" max="999" value="'+d.placementPoints+'" oninput="updateDraftPoints('+i+',this.value)"></td><td><div class="bold" id="pay_'+i+'" style="color:var(--ok);font-size:14px">₹'+payment+'</div></td></tr>';});
  html+='</tbody></table>';
  const totalKills=state.resultDraft.reduce((s,d)=>s+d.kills,0);
  const totalPayment=state.resultDraft.reduce((s,d)=>s+d.kills*rate,0);
  const anyKills=state.resultDraft.some(d=>d.kills>0);
  html+='<div class="card" style="margin-top:10px;padding:14px;background:linear-gradient(145deg,#2a2a55,#12122e);border:1px solid var(--border)"><div class="between" style="margin-bottom:6px"><span class="bold">Total Kills</span><span class="bold" id="totalKills" style="color:var(--secondary)">'+totalKills+'</span></div><div class="between"><span class="bold">Total Payout</span><span class="bold" id="totalPayment" style="color:var(--ok);font-size:18px">₹'+totalPayment+'</span></div></div>';
  html+='<button class="btn btn-primary btn-block mt12" id="publishBtn" onclick="adminPublishResults2()"'+(anyKills?'':' disabled')+'>'+(anyKills?'PUBLISH & PAY ₹'+totalPayment:'ENTER KILLS TO PUBLISH')+'</button>';
  return html;
}
function updateDraftKills(i,val){const d=state.resultDraft[i];if(!d)return;d.kills=Math.max(0,Math.min(999,parseInt(val,10)||0));const t=tournamentById(state.resTourId);const rate=t?(t.killRate||0):0;const payEl=document.getElementById('pay_'+i);if(payEl)payEl.textContent='₹'+(d.kills*rate);updateResultTotals();}
function updateDraftPoints(i,val){const d=state.resultDraft[i];if(!d)return;d.placementPoints=Math.max(0,Math.min(999,parseInt(val,10)||0));}
function updateResultTotals(){
  const t=tournamentById(state.resTourId);const rate=t?(t.killRate||0):0;
  let totalKills=0,totalPayment=0;
  state.resultDraft.forEach(d=>{totalKills+=d.kills;totalPayment+=d.kills*rate;});
  const el1=document.getElementById('totalKills');if(el1)el1.textContent=totalKills;
  const el2=document.getElementById('totalPayment');if(el2)el2.textContent='₹'+totalPayment;
  const btn=document.getElementById('publishBtn');
  if(btn){const anyKills=state.resultDraft.some(d=>d.kills>0);btn.disabled=!anyKills;btn.innerHTML=anyKills?'PUBLISH & PAY ₹'+totalPayment:'ENTER KILLS TO PUBLISH';}
}
function adminPublishResults2(){
  const tid=state.resTourId;
  if(!tid)return toast('Select tournament','bad');
  if(!state.resultDraft.length)return toast('No players','bad');
  const t=tournamentById(tid);if(!t)return;
  const rate=t.killRate||0;
  const totalKills=state.resultDraft.reduce((s,d)=>s+d.kills,0);
  const totalPayment=state.resultDraft.reduce((s,d)=>s+d.kills*rate,0);
  if(totalKills===0)return toast('Enter kills','bad');
  const existing=DB.results.find(r=>r.tournamentId===tid);
  const msg=(existing?'⚠️ Already exists. ':'')+'Total: '+totalKills+' × ₹'+rate+' = ₹'+totalPayment+'. Proceed?';
  confirmAction(existing?'Re-publish?':'Publish Results?',msg,async()=>{
    try{
      const sorted=state.resultDraft.slice().sort((a,b)=>(b.kills+b.placementPoints)-(a.kills+a.placementPoints));
      const entries=sorted.map((d,i)=>({gameName:d.gameName,ffUid:d.ffUid,kills:d.kills,placement:i+1,placementPoints:d.placementPoints,total:d.kills+d.placementPoints,payment:d.kills*rate}));
      await db.collection('results').add({tournamentId:tid,publishedAt:nowISO(),entries,killRate:rate,totalPayment,totalKills});
      for(const e of entries){
        const uSnap=await db.collection('users').where('ffUid','==',e.ffUid).get();
        if(!uSnap.empty){
          const uid=uSnap.docs[0].id;
          await db.collection('users').doc(uid).update({availCoins:firebase.firestore.FieldValue.increment(e.payment),winCoins:firebase.firestore.FieldValue.increment(e.payment),matches:firebase.firestore.FieldValue.increment(1),kills:firebase.firestore.FieldValue.increment(e.kills),points:firebase.firestore.FieldValue.increment(e.total)});
          if(e.payment>0)await db.collection('walletTransactions').add({userId:uid,type:'Winning',title:'Kill reward — '+t.name,amount:e.payment,status:'Completed',time:nowISO()});
        }
        const lbSnap=await db.collection('leaderboard').where('ffUid','==',e.ffUid).get();
        if(lbSnap.empty)await db.collection('leaderboard').add({name:e.gameName,gameName:e.gameName,ffUid:e.ffUid,kills:e.kills,wins:e.placement===1?1:0,points:e.total});
        else await db.collection('leaderboard').doc(lbSnap.docs[0].id).update({kills:firebase.firestore.FieldValue.increment(e.kills),points:firebase.firestore.FieldValue.increment(e.total),wins:firebase.firestore.FieldValue.increment(e.placement===1?1:0)});
      }
      await db.collection('tournaments').doc(tid).update({status:'Completed'});
      logAdmin('Published results & paid ₹'+totalPayment+' for '+t.name);
      state.resultDraft=[];state.resTourId='';state.resultDraftTid='';
      toast('Published! ₹'+totalPayment+' paid.','ok');
    }catch(e){console.error(e);toast('Publish failed: '+e.message,'bad');}
  },'PUBLISH',!!existing);
}
function viewResultDetail(resultId){
  const r=DB.results.find(x=>x.id===resultId);if(!r)return;
  const t=tournamentById(r.tournamentId);
  const rows=r.entries.map((e,i)=>{const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';return '<div class="list-row"><div class="rank-badge '+rc+'">'+(i+1)+'</div><div class="list-main"><div class="list-title">'+esc(e.gameName)+'</div><div class="list-sub">'+e.kills+' kills · '+e.placementPoints+' pts</div></div><div style="text-align:right;flex:none"><div class="bold" style="color:var(--ok)">₹'+(e.payment||0)+'</div></div></div>';}).join('');
  openModal('<div class="modal-head">'+esc(t?t.name:'Result')+'</div><div class="small muted" style="margin-bottom:12px">Published '+fmtStamp(r.publishedAt)+'</div>'+rows+'<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">CLOSE</button></div>');
}
function adminDeleteResult(id){
  confirmAction('Delete result?','Payments will NOT be reversed.',async()=>{
    try{await db.collection('results').doc(id).delete();logAdmin('Deleted result');toast('Deleted','info');}
    catch(e){toast('Failed','bad');}
  },'DELETE',true);
}

function adminPlayers(){
  const q=state.playerQuery||'';
  let html='<div class="card-wrapper"><div class="card"><div class="between" style="margin-bottom:10px"><div class="bold">REGISTERED PLAYERS</div><span class="chip chip-blue">TOTAL '+DB.users.length+'</span></div><div class="field" style="margin-bottom:12px"><input class="input" id="playerSearch" placeholder="🔍 Search name, IGN, mobile..." value="'+esc(q)+'" oninput="setPlayerQuery(this.value)"></div><div id="adminPlayerList">'+adminPlayerListHTML(q)+'</div></div></div>';
  return html;
}
function setPlayerQuery(v){state.playerQuery=v;const el=$('#adminPlayerList');if(el)el.innerHTML=adminPlayerListHTML(v);}
function adminPlayerListHTML(q){
  q=(q||'').trim().toLowerCase();
  let users=DB.users.slice();
  if(q)users=users.filter(u=>(u.name||'').toLowerCase().includes(q)||(u.gameName||'').toLowerCase().includes(q)||(u.mobile||'').includes(q)||(u.ffUid||'').includes(q));
  if(!users.length)return '<div class="small muted">No players matched.</div>';
  return users.map(u=>'<div class="list-row" style="cursor:pointer" onclick="adminOpenPlayer(\''+u.id+'\')">'+avatarHTML(u,40)+'<div class="list-main"><div class="list-title">'+esc(u.gameName)+(u.role==='admin'?' (Admin)':'')+'</div><div class="list-sub">'+esc(u.mobile)+' · ₹'+u.availCoins+'</div></div><span class="chip chip-gray" style="flex:none">VIEW</span></div>').join('');
}
function adminOpenPlayer(id){
  const u=DB.users.find(x=>x.id===id);if(!u)return;
  const row=(k,v)=>'<tr><td style="color:var(--text-muted);white-space:nowrap">'+esc(k)+'</td><td class="bold" style="text-align:right">'+v+'</td></tr>';
  openModal('<div class="modal-head">PLAYER PROFILE</div><div class="flex" style="gap:12px;margin-bottom:14px">'+avatarHTML(u,60)+'<div><div class="bold" style="font-size:18px">'+esc(u.name)+'</div><div class="small muted">'+esc(u.gameName)+'</div></div></div><table class="mini-table"><tbody>'+row('Mobile',esc(u.mobile))+row('FF UID',esc(u.ffUid))+row('Wallet','<span style="color:var(--primary);font-size:18px">₹'+u.availCoins+'</span>')+row('Winnings','<span style="color:var(--ok)">₹'+u.winCoins+'</span>')+row('Matches',u.matches+'')+row('Status',u.blocked?'<span style="color:var(--bad)">Blocked</span>':'<span style="color:var(--ok)">Active</span>')+'</tbody></table><div class="divider"></div><div class="bold small" style="margin-bottom:8px">💰 ADJUST WALLET</div><div class="field"><input class="input" id="adjAmt" type="number" min="1" placeholder="Amount in ₹"></div><div class="grid2"><button class="btn btn-ok btn-sm" onclick="adminAdjustWallet(\''+u.id+'\',1)">+ ADD MONEY</button><button class="btn btn-danger btn-sm" onclick="adminAdjustWallet(\''+u.id+'\',-1)">− DEDUCT MONEY</button></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">CLOSE</button><button class="btn '+(u.blocked?'btn-ok':'btn-danger')+'" onclick="adminToggleBlock(\''+u.id+'\')">'+(u.blocked?'UNBLOCK':'BLOCK')+'</button></div>');
}
async function adminAdjustWallet(id,sign){
  const u=DB.users.find(x=>x.id===id);if(!u)return;
  const amt=parseInt($('#adjAmt').value,10);
  if(!amt||amt<=0)return toast('Enter amount','bad');
  if(sign<0&&u.availCoins<amt)return toast('Insufficient balance','bad');
  try{
    await db.collection('users').doc(id).update({availCoins:firebase.firestore.FieldValue.increment(sign*amt)});
    await db.collection('walletTransactions').add({userId:id,type:sign>0?'Deposit':'Withdrawal',title:sign>0?'Admin credit':'Admin deduction',amount:amt,status:'Completed',time:nowISO()});
    logAdmin((sign>0?'Credited ₹'+amt+' to ':'Deducted ₹'+amt+' from ')+u.gameName);
    toast('✅ '+(sign>0?'Added':'Deducted')+' ₹'+amt,'ok');
    setTimeout(()=>adminOpenPlayer(id),500);
  }catch(e){toast('Failed: '+e.message,'bad');}
}
async function adminToggleBlock(id){
  const u=DB.users.find(x=>x.id===id);
  if(!u||u.role==='admin')return;
  try{await db.collection('users').doc(id).update({blocked:!u.blocked});logAdmin((u.blocked?'Unblocked ':'Blocked ')+u.gameName);toast(u.blocked?'Unblocked':'Blocked','ok');setTimeout(()=>adminOpenPlayer(id),500);}
  catch(e){toast('Failed','bad');}
}

function adminContent(){
  let html='<div class="card-wrapper"><div class="card"><div class="bold" style="margin-bottom:10px">ANNOUNCEMENTS</div><div class="field"><label class="label">Title</label><input class="input" id="anTitle" maxlength="60"></div><div class="field"><label class="label">Message</label><textarea class="input" id="anBody" maxlength="300" rows="3"></textarea></div><button class="btn btn-primary btn-block" onclick="adminAddAnnouncement()">PUBLISH</button><div class="divider"></div>';
  if(!DB.announcements.length)html+='<div class="small muted">No announcements.</div>';
  else html+=DB.announcements.map(a=>'<div class="list-row"><div class="list-main"><div class="list-title">'+esc(a.title)+'</div><div class="list-sub" style="white-space:normal">'+esc(a.body)+'</div></div><button class="btn btn-danger btn-sm" onclick="adminDeleteAnnouncement(\''+a.id+'\')">'+icon('trash',16)+'</button></div>').join('');
  html+='</div></div>';
  return html;
}
async function adminAddAnnouncement(){
  const title=$('#anTitle').value.trim(),body=$('#anBody').value.trim();
  if(title.length<3||body.length<3)return toast('Fill both','bad');
  try{await db.collection('announcements').add({title,body,time:nowISO()});toast('Published','ok');}
  catch(e){toast('Failed','bad');}
}
async function adminDeleteAnnouncement(id){
  try{await db.collection('announcements').doc(id).delete();toast('Deleted','info');}
  catch(e){toast('Failed','bad');}
}

function adminWallet(){
  const approved=DB.paymentRequests.filter(p=>p.status==='Approved');
  const pendingD=DB.paymentRequests.filter(p=>(p.status==='Pending'||p.status==='Processing')&&p.type==='Deposit').length;
  const pendingW=DB.paymentRequests.filter(p=>(p.status==='Pending'||p.status==='Processing')&&p.type==='Withdrawal').length;
  const totalIn=approved.filter(p=>p.type==='Deposit').reduce((s,p)=>s+p.amount,0);
  const totalOut=approved.filter(p=>p.type==='Withdrawal').reduce((s,p)=>s+p.amount,0);
  const totalBalance=DB.users.reduce((s,u)=>s+(u.availCoins||0),0);
  let html='<div class="grid2"><div class="stat-card"><div class="stat-v" style="color:var(--warn)">'+pendingD+'</div><div class="stat-l">Pending Deposits</div></div><div class="stat-card"><div class="stat-v" style="color:var(--warn)">'+pendingW+'</div><div class="stat-l">Pending Withdrawals</div></div><div class="stat-card"><div class="stat-v" style="color:var(--ok)">₹'+totalIn+'</div><div class="stat-l">Total Deposited</div></div><div class="stat-card"><div class="stat-v" style="color:var(--bad)">₹'+totalOut+'</div><div class="stat-l">Total Withdrawn</div></div><div class="stat-card" style="grid-column:span 2"><div class="stat-v" style="color:var(--primary)">₹'+totalBalance+'</div><div class="stat-l">Total User Balance (All Users)</div></div></div>';
  html+='<div class="card-wrapper mt12"><div class="card"><div class="between" style="margin-bottom:8px"><div class="bold">MANAGE PAYMENTS</div><button class="btn btn-primary btn-sm" onclick="setAdminTab(\'payments\')">OPEN</button></div></div></div>';
  return html;
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
let initialized=false;
async function init(){
  if(initialized)return;initialized=true;
  buildNav();
  ['loginMobile','loginPassword'].forEach(id=>{const el=$('#'+id);if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter')directLogin();});});
  ['regMobile','regPassword','regPassword2'].forEach(id=>{const el=$('#'+id);if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter')directRegister();});});
  try{const s=localStorage.getItem(SESSION_KEY);if(s)session=JSON.parse(s);}catch(e){session=null;}
  try{
    toast('Connecting to Cloud...','info');
    await seedInitialData();
    await ensureAdminAccount();
    startRealtimeSync();
    startCountdownTicker();
    go('auth');
  }catch(e){console.error(e);toast('Cloud connection failed. Check Firestore rules.','bad');go('auth');}
}
document.addEventListener('DOMContentLoaded',init);
if(document.readyState==='interactive'||document.readyState==='complete')init();
</script>
