<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06061a">
<meta name="description" content="Free Fire India Tournament - Premium gaming tournament platform">
<title>Free Fire India Tournament</title>
<link rel="icon" type="image/jpeg" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #06061a;
  --bg-gradient:
    radial-gradient(ellipse at 15% -10%, rgba(124,58,237,0.45) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 5%, rgba(255,60,0,0.25) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(0,229,255,0.12) 0%, transparent 60%),
    linear-gradient(180deg, #0a0a1f 0%, #06061a 100%);
  --card-bg: #12122a;
  --card-bg-gradient: linear-gradient(145deg, #1e1e42 0%, #16162e 50%, #0b0b1c 100%);
  --panel-bg: #1a1a38;
  --primary: #ff3c00;
  --primary-dark: #a82100;
  --primary-light: #ff6b3d;
  --primary-glow: rgba(255, 60, 0, 0.65);
  --secondary: #00e5ff;
  --cyan: #00e5ff;
  --magenta: #ff00aa;
  --purple: #a855f7;
  --gold: #ffd700;
  --text-main: #f4f4ff;
  --text-muted: #8a8ab0;
  --border: #2a2a55;
  --border-glow: rgba(255, 60, 0, 0.4);
  --ok: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --grad: linear-gradient(180deg, #ff8555 0%, #ff3c00 48%, #d42e00 100%);
  --grad-deep: linear-gradient(135deg, #0d0d20 0%, #2a0a3a 100%);
  --shadow: 0 20px 50px rgba(0,0,0,0.7), 0 8px 18px rgba(0,0,0,0.5);
  --shadow-sm: 0 8px 20px rgba(0,0,0,0.5);
  --nav-h: 74px;
  --font-head: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family: var(--font-body);
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  background-color: var(--bg);
}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:var(--font-body);font-size:15px; font-weight: 600;}
button{cursor:pointer}
a{color:var(--secondary);text-decoration:none}

.app{max-width:540px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 40px);min-height:100vh}

#appHeader{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(180deg, rgba(10,10,30,0.98) 0%, rgba(10,10,25,0.92) 100%);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom: 1px solid rgba(255,60,0,0.25);
  box-shadow: 0 6px 25px rgba(0,0,0,0.85), 0 1px 0 rgba(255,255,255,0.04) inset;
}
.hdr{max-width:540px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px; position:relative;height:70px;}
.hdr::after{
  content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
  width: 55%; height: 2px; background: linear-gradient(90deg, transparent, var(--primary), var(--magenta), var(--primary), transparent);
  box-shadow: 0 0 14px var(--primary), 0 0 4px var(--magenta);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:46px;height:50px;background:linear-gradient(145deg, #1a1a35, #0a0a1c);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  border: 2px solid var(--primary);
  box-shadow: 0 0 20px var(--primary-glow), inset 0 0 15px rgba(255,60,0,0.3);
}
.logo img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-family: var(--font-head); font-size:13px;font-weight:800;letter-spacing:1.2px;line-height:1.1;color:var(--text-main); text-shadow: 0 2px 8px rgba(0,0,0,0.6);}
.brand-sub{font-size:9px;font-weight:700;letter-spacing:2.5px;color:var(--secondary);margin-top:2px; text-shadow: 0 0 8px rgba(0,229,255,0.6);}
.hdr-actions{display:flex;align-items:center;gap:12px}
.icon-btn{
  position:relative;width:42px;height:42px;
  border:1px solid var(--border);
  background: linear-gradient(180deg, #22224a 0%, #12122e 100%);
  display:grid;place-items:center;color:var(--text-main);
  border-radius: 10px;
  box-shadow:
    0 4px 0 #0a0a1c,
    0 6px 14px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.1);
  transition: transform .12s ease, box-shadow .12s ease, background .15s ease, border-color .15s ease;
}
.icon-btn:active{
  transform:translateY(3px);
  box-shadow: 0 1px 0 #0a0a1c, 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  border-color: var(--primary);
}

.view{display:none;padding:14px 16px 10px}
.view.active{display:block;animation:fadeUp .3s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.card-wrapper {
  position: relative;
  margin-bottom: 16px;
  filter: drop-shadow(0 12px 24px rgba(0,0,0,0.55)) drop-shadow(0 4px 10px rgba(0,0,0,0.4));
}
.card-wrapper::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--primary) 0%, var(--magenta) 50%, var(--secondary) 100%);
  border-radius: 18px;
  z-index: -1;
  opacity: 0.85;
}
.card {
  background: var(--card-bg-gradient);
  border: 1px solid rgba(255,255,255,0.05);
  padding: 20px 18px;
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -1px 0 rgba(0,0,0,0.4);
}
.card-hero{ background: linear-gradient(135deg, #1a0a2e 0%, #0d0d20 60%, #2a0a1a 100%); position:relative; overflow:hidden; border:1px solid rgba(255,60,0,0.25); }
.card-hero::after{
  content:"";position:absolute;width:260px;height:260px;right:-90px;top:-100px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,60,0,.35) 0%,rgba(255,60,0,0) 70%);
  pointer-events: none;
}
.hero-inner{position:relative;z-index:2}

.hero-banner {
  position: relative;
  height: 170px;
  margin-bottom: 18px;
  border-radius: 18px;
  background: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1000&auto=format&fit=crop') center/cover;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 6px 15px rgba(255,60,0,0.3), inset 0 0 0 1px rgba(255,60,0,0.3);
  overflow: hidden;
}
.hero-banner::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(6,6,26,1) 0%, rgba(255,60,0,0.25) 55%, transparent 100%);
}
.hero-banner::after {
  content: ''; position: absolute; inset: 0;
  border: 2px solid rgba(255,60,0,0.4);
  border-radius: 18px;
  box-shadow: inset 0 0 30px rgba(255,60,0,0.25);
  pointer-events: none;
}
.hero-dots { display: flex; gap: 8px; position: relative; z-index: 2;}
.hero-dot { width: 32px; height: 5px; background: rgba(255,255,255,0.25); border-radius: 3px;}
.hero-dot.active { background: linear-gradient(90deg, var(--primary), var(--magenta)); box-shadow: 0 0 12px var(--primary); }

.filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 8px; }
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-btn {
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(180deg, #1e1e42 0%, #12122e 100%);
  border: 1px solid var(--border);
  color: var(--text-muted); padding: 9px 18px; border-radius: 12px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.6px; flex: none;
  box-shadow: 0 4px 0 #0a0a1c, 0 6px 12px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  transition: all 0.15s ease;
  font-family: var(--font-head);
}
.filter-btn.active {
  border-color: var(--primary); color: #fff;
  background: linear-gradient(180deg, #ff5c2a 0%, #d42e00 100%);
  box-shadow: 0 4px 0 #8b1f00, 0 8px 20px rgba(255,60,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
}

.cyber-card { position: relative; margin-bottom: 18px; filter: drop-shadow(0 14px 28px rgba(0,0,0,0.6)) drop-shadow(0 5px 12px rgba(0,0,0,0.45)); }
.cyber-card-bg { background: linear-gradient(135deg, #ff3c00 0%, #a855f7 50%, #00e5ff 100%); border-radius: 18px; padding: 2px; box-shadow: inset 0 0 20px rgba(0,0,0,0.3); }
.cyber-card-inner { background: linear-gradient(145deg, #1e1e42 0%, #16162e 55%, #0b0b1c 100%); border-radius: 16px; display: flex; padding: 14px; gap: 12px; position: relative; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.4); }
.cc-left { width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.cc-avatar-wrap { width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(145deg, #2a2a55, #12122e); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(255,60,0,0.4), inset 0 0 15px rgba(0,0,0,0.8), inset 0 2px 0 rgba(255,255,255,0.1); }
.cc-avatar-wrap svg { width: 40px; height: 40px; fill: var(--primary); filter: drop-shadow(0 0 8px rgba(255,60,0,0.6)); }
.cc-lines { width: 40px; height: 6px; background: linear-gradient(90deg, #3a3a6a, #22224a); border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
.cc-mid { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.cc-title { font-family: var(--font-head); font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,0.6);}
.cc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px;}
.cc-stat-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--text-muted); }
.cc-stat-item svg { width: 14px; height: 14px; fill: var(--primary); filter: drop-shadow(0 0 4px rgba(255,60,0,0.4)); }
.cc-progress-wrap { width: 100%; height: 8px; background: #0a0a1c; border-radius: 4px; overflow: hidden; margin-bottom: 6px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), inset 0 -1px 0 rgba(255,255,255,0.05); }
.cc-progress { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--primary), var(--magenta)); box-shadow: 0 0 12px var(--primary), inset 0 1px 0 rgba(255,255,255,0.3); border-radius: 4px; }
.cc-slots { font-size: 10px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.6px;}
.cc-btn {
  margin-top: 8px;
  background: linear-gradient(180deg, #2a2a55 0%, #16162e 100%);
  border: 1px solid var(--border);
  color: var(--primary); padding: 8px 14px; font-size: 12px; font-weight: 800;
  border-radius: 8px;
  text-align: center; transition: 0.15s; letter-spacing: 0.5px;
  box-shadow: 0 4px 0 #0a0a1c, 0 6px 12px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  font-family: var(--font-head);
}
.cc-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a0a1c, 0 2px 4px rgba(0,0,0,0.4); }
.cc-right { width: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hex-badge { width: 44px; height: 48px; background: linear-gradient(145deg, #2a2a55, #12122e); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); display: flex; align-items: center; justify-content: center; border: 2px solid var(--primary); box-shadow: 0 0 15px var(--primary-glow), inset 0 0 10px rgba(0,0,0,0.6); }
.hex-badge svg { width: 22px; height: 22px; fill: var(--primary); filter: drop-shadow(0 0 6px rgba(255,60,0,0.7)); }

.btn{
  border:1px solid transparent; border-radius: 12px; padding:14px 20px;
  font-weight:800; font-size:15px;
  background: linear-gradient(180deg, #2a2a55 0%, #16162e 100%);
  color:var(--text-main);
  transition: all .1s cubic-bezier(.22,1,.36,1);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow: 0 5px 0 #0a0a1c, 0 8px 16px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  letter-spacing: 0.6px; position: relative; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
.btn:active{ transform:translateY(3px); box-shadow: 0 2px 0 #0a0a1c, 0 4px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); }
.btn-primary{
  background: linear-gradient(180deg, #ff8555 0%, #ff3c00 48%, #d42e00 100%);
  color:#fff; border: none; font-family: var(--font-head);
  box-shadow: 0 6px 0 #8b1f00, 0 10px 22px rgba(255,60,0,0.5), 0 3px 8px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.35);
}
.btn-ghost{ background: linear-gradient(180deg, #1e1e42 0%, #12122e 100%); border: 1px solid var(--border); color:var(--text-main) }
.btn-danger{ background: linear-gradient(180deg, #ff5555 0%, #dc2626 50%, #991b1b 100%); color:#fff; box-shadow: 0 5px 0 #7f1d1d, 0 8px 18px rgba(239,68,68,0.5), inset 0 2px 0 rgba(255,255,255,0.25); }
.btn-ok{ background: linear-gradient(180deg, #34d399 0%, #10b981 50%, #047857 100%); color:#fff; box-shadow: 0 5px 0 #065f46, 0 8px 18px rgba(16,185,129,0.5), inset 0 2px 0 rgba(255,255,255,0.25); }
.btn-sm{padding:10px 15px;font-size:13px;border-radius:10px;}
.btn-block{width:100%}
.btn:disabled{opacity:.45;filter:grayscale(.7);pointer-events:none}

#bottomNav{
  position:fixed;left:0;right:0;bottom:0;z-index:70;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(180deg, rgba(16,16,38,0.98) 0%, rgba(8,8,22,0.98) 100%);
  backdrop-filter:blur(20px);
  border-top: 1px solid rgba(255,60,0,0.25);
  display:flex;align-items:stretch;justify-content:space-around;
  box-shadow: 0 -8px 30px rgba(0,0,0,0.8), 0 -1px 0 rgba(255,255,255,0.05) inset;
}
.nav-inner{max-width:540px;margin:0 auto;display:flex;width:100%}
.nav-item{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:1.2px;padding:8px 0;position:relative;
  transition:all .2s ease; font-family: var(--font-head);
}
.nav-item svg { fill: var(--text-muted); transition: all .25s cubic-bezier(.22,1,.36,1); width: 24px; height: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }
.nav-item.active{ color:var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
.nav-item.active svg { fill: var(--primary); filter: drop-shadow(0 0 10px rgba(255,60,0,0.9)); transform: translateY(-2px) scale(1.1); }
.nav-item.active::before{
  content:"";position:absolute;top:0;width:36px;height:3px;
  background: linear-gradient(90deg, var(--cyan), var(--primary), var(--magenta));
  box-shadow: 0 0 15px var(--primary);
  border-radius: 0 0 3px 3px;
}

.empty{text-align:center;padding:34px 16px;color:var(--text-muted)}
.empty-ic{ width:64px;height:64px; background: linear-gradient(145deg, #2a2a55, #12122e); display:grid;place-items:center;margin:0 auto 12px;color:var(--primary); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 6px 0 #0a0a1c, 0 10px 20px rgba(0,0,0,0.5); }
.empty-t{font-weight:700;color:var(--text-main);font-size:15px;margin-bottom:4px}
.empty-s{font-size:13px;font-weight:600}
.avatar{ border-radius:50%;object-fit:cover; border:2px solid var(--primary); box-shadow: 0 0 15px var(--primary-glow), 0 4px 8px rgba(0,0,0,0.6); flex:none; }
.avatar-txt{ display:grid;place-items:center; background: linear-gradient(145deg, #2a2a55, #12122e); color:var(--primary);font-weight:800;letter-spacing:.5px; text-shadow: 0 0 8px rgba(255,60,0,0.6); }
.stat{ background: linear-gradient(145deg, rgba(255,255,255,.05), rgba(255,255,255,.01)); border:1px solid var(--border); padding:12px 10px;text-align:center; border-radius: 12px; box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 6px 12px rgba(0,0,0,0.4); }
.stat-v{font-family: var(--font-head); font-size:19px;font-weight:800;line-height:1.1; color: var(--text-main); }
.stat-l{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);margin-top:4px}
.stat-card{ background: linear-gradient(145deg, #1e1e42 0%, #12122e 100%); border:1px solid var(--border); padding:14px 10px;text-align:center; box-shadow: 0 6px 0 #0a0a1c, 0 10px 20px rgba(0,0,0,0.5); border-radius: 14px; }
.chip{ display:inline-flex;align-items:center;gap:5px;padding:5px 11px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase; border:1px solid transparent; border-radius: 8px; }
.chip-blue{background:linear-gradient(180deg,rgba(255,60,0,0.2),rgba(255,60,0,0.08));border-color:rgba(255,60,0,0.4);color:var(--primary)}
.chip-green{background:linear-gradient(180deg,rgba(16,185,129,0.2),rgba(16,185,129,0.08));border-color:rgba(16,185,129,0.4);color:var(--ok)}
.chip-orange{background:linear-gradient(180deg,rgba(245,158,11,0.2),rgba(245,158,11,0.08));border-color:rgba(245,158,11,0.4);color:var(--warn)}
.chip-red{background:linear-gradient(180deg,rgba(239,68,68,0.2),rgba(239,68,68,0.08));border-color:rgba(239,68,68,0.4);color:var(--bad)}
.chip-gray{background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border-color:rgba(255,255,255,0.15);color:var(--text-muted)}
.field{margin-bottom:14px}
.label{display:block;font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:7px;letter-spacing:.5px;}
.input{ width:100%;padding:13px 16px; border:1px solid var(--border); background: linear-gradient(180deg, #0a0a1c 0%, #12122e 100%); color:var(--text-main);outline:none; border-radius: 10px; transition:border .15s, background .15s, box-shadow .15s; box-shadow: inset 0 2px 6px rgba(0,0,0,0.6); }
.input:focus{ border-color:var(--primary); background: linear-gradient(180deg, #12122e 0%, #1a1a3a 100%); box-shadow: 0 0 0 3px rgba(255,60,0,0.15), 0 0 15px rgba(255,60,0,0.3), inset 0 2px 6px rgba(0,0,0,0.5); }
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 14px}
.sec-title{font-family: var(--font-head); font-size:15px;font-weight:700;letter-spacing:1.2px;display:flex;align-items:center;gap:8px;color:var(--text-main); text-transform: uppercase; }
.sec-link{font-size:13px;font-weight:700;color:var(--secondary); font-family:var(--font-head); letter-spacing: 0.5px; }
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.center{text-align:center}
.muted{color:var(--text-muted)}
.small{font-size:12px}
.bold{font-weight:800}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 14px 0; }

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:bdIn .2s ease;}
@keyframes bdIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:540px;
  background: linear-gradient(180deg, #1a1a3a 0%, #0d0d20 100%);
  padding:20px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
  animation:modalIn .3s cubic-bezier(.22,1,.36,1);
  border-top-left-radius: 22px;
  border-top-right-radius: 22px;
  border-top: 2px solid var(--primary);
  box-shadow: 0 -20px 50px rgba(255,60,0,0.25), 0 -4px 20px rgba(0,0,0,0.8);
}
@keyframes modalIn{from{transform:translateY(60px);opacity:.6}to{transform:none;opacity:1}}

function resizeImage(file, maxDim, cb) {
  const r = new FileReader();
  r.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else        { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => cb(null);
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
}

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) { DB = JSON.parse(raw); }
    else { DB = seedDB(); localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  } catch (e) { DB = seedDB(); }

  if (!DB.paymentRequests) DB.paymentRequests = [];
  if (!DB.walletTransactions) DB.walletTransactions = [];
  if (!DB.screenshots) DB.screenshots = [];
  delete DB.notifications;

  DB.users.forEach(u => {
    if (typeof u.availCoins !== 'number') u.availCoins = 0;
    if (typeof u.winCoins !== 'number') u.winCoins = 0;
  });
  DB.tournaments.forEach(t => {
    if (t.prize1 === undefined) t.prize1 = '';
    if (t.prize2 === undefined) t.prize2 = '';
    if (t.killRate === undefined) t.killRate = 0;
  });
  DB.results.forEach(r => {
    if (r.killRate === undefined) r.killRate = 0;
    if (r.totalPayment === undefined) r.totalPayment = 0;
    if (r.totalKills === undefined) r.totalKills = 0;
    (r.entries || []).forEach(e => {
      if (e.payment === undefined) e.payment = 0;
    });
  });

  let adminUser = DB.users.find(u => u.mobile === ADMIN_MOBILE);
  if (!adminUser) {
    adminUser = {
      id: 'admin_user_1', name: 'Admin', gameName: 'ADMIN', ffUid: '000000000',
      mobile: ADMIN_MOBILE, passwordHash: hashPassword(ADMIN_PASSWORD),
      passwordPlain: ADMIN_PASSWORD, photo: '',
      matches: 0, wins: 0, points: 0, kills: 0,
      availCoins: 0, winCoins: 0, blocked: false, role: 'admin', createdAt: nowISO()
    };
    DB.users.push(adminUser); saveDB();
  } else {
    let needsSave = false;
    if (adminUser.role !== 'admin') { adminUser.role = 'admin'; needsSave = true; }
    if (adminUser.passwordHash !== hashPassword(ADMIN_PASSWORD)) { adminUser.passwordHash = hashPassword(ADMIN_PASSWORD); needsSave = true; }
    if (!adminUser.passwordPlain) { adminUser.passwordPlain = ADMIN_PASSWORD; needsSave = true; }
    if (needsSave) saveDB();
  }

  try {
    const s = localStorage.getItem(SESSION_KEY);
    session = s ? JSON.parse(s) : null;
  } catch (e) { session = null; }
  if (session && !DB.users.some(u => u.id === session.userId)) session = null;

/* ============================================================

let countdownTicker = null;

function parseTournamentStart(t) {
  if (!t || !t.date || !t.time) return null;
  const d = new Date(t.date + 'T' + (t.time.length === 5 ? t.time + ':00' : t.time));
  if (isNaN(d.getTime())) return null;
  return d;
}

function getCountdownChip(t) {
  if (!t) return { html: '—', stateClass: 'empty' };
  if (t.status === 'Completed') return { html: '✓ COMPLETED', stateClass: 'completed' };
  if (t.status === 'Live') return { html: '🔴 LIVE NOW', stateClass: 'live' };
  const start = parseTournamentStart(t);
  if (!start) return { html: '⏱ TIME TBA', stateClass: 'empty' };
  const diff = start.getTime() - Date.now();
  if (diff <= 0) return { html: '⚡ STARTING SOON', stateClass: 'starting' };
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);
  if (days > 0) return { html: '⏱ ' + days + 'd ' + pad2(hours) + 'h ' + pad2(minutes) + 'm', stateClass: 'far' };
  if (hours > 0) return { html: '⏱ ' + pad2(hours) + ':' + pad2(minutes) + ':' + pad2(seconds), stateClass: 'near' };
  return { html: '⏱ ' + pad2(minutes) + ':' + pad2(seconds), stateClass: 'soon' };
}

function getCountdownBig(t) {
  if (!t) return { html: '<div class="cd-tba">TIME TBA</div>', stateClass: '' };
  if (t.status === 'Completed') return { html: '<div class="cd-completed">✓ COMPLETED</div>', stateClass: '' };
  if (t.status === 'Live') return { html: '<div class="cd-live-big">🔴 LIVE NOW</div>', stateClass: 'live' };
  const start = parseTournamentStart(t);
  if (!start) return { html: '<div class="cd-tba">TIME TBA</div>', stateClass: '' };
  const diff = start.getTime() - Date.now();
  if (diff <= 0) return { html: '<div class="cd-starting">⚡ STARTING SOON</div>', stateClass: 'starting' };
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);
  const units = [];
  if (days > 0) units.push({ n: pad2(days), l: 'DAYS' });
  units.push({ n: pad2(hours), l: 'HRS' });
  units.push({ n: pad2(minutes), l: 'MIN' });
  units.push({ n: pad2(seconds), l: 'SEC' });
  const html = units.map((u, i) =>
    (i > 0 ? '<div class="cd-sep">:</div>' : '') +
    '<div class="cd-unit"><div class="cd-num">' + u.n + '</div><div class="cd-lbl">' + u.l + '</div></div>'
  ).join('');
  return { html: html, stateClass: days > 0 ? 'far' : (hours > 0 ? 'near' : 'soon') };
}

function screenshotWindowOpen(t) {
  if (!t) return false;
  if (t.status === 'Completed') return false;
  if (t.status === 'Live') return true;
  const start = parseTournamentStart(t);
  if (!start) return false;
  return Date.now() >= start.getTime() + 60000;
}

function updateAllCountdowns() {
  document.querySelectorAll('[data-screenshot-cd-tid]').forEach(el => {
    const tid = el.getAttribute('data-screenshot-cd-tid');
    const t = tournamentById(tid);
    if (!t) return;
    const start = parseTournamentStart(t);
    if (!start) { el.textContent = 'TBA'; return; }
    const diff = start.getTime() + 60000 - Date.now();
    if (diff <= 0) {
      if (state.view === 'details' && state.param === tid) renderDetails();
      else if (state.view === 'matches') renderMatches();
      else el.textContent = '✅ OPEN';
    } else {
      const mm = Math.floor(diff / 60000);
      const ss = Math.floor((diff % 60000) / 1000);
      el.textContent = '⏱ Opens in ' + pad2(mm) + ':' + pad2(ss);
    }
  });

  const chips = document.querySelectorAll('[data-cd-tid]');
  chips.forEach(el => {
    const tid = el.getAttribute('data-cd-tid');
    const t = tournamentById(tid);
    if (!t) return;
    const cd = getCountdownChip(t);
    el.innerHTML = cd.html;
    el.className = 'countdown-chip ' + cd.stateClass;
  });

  const bigs = document.querySelectorAll('[data-cd-big-tid]');
  bigs.forEach(el => {
    const tid = el.getAttribute('data-cd-big-tid');
    const t = tournamentById(tid);
    if (!t) return;
    const cd = getCountdownBig(t);
    el.innerHTML = cd.html;
    el.className = 'countdown-grid ' + cd.stateClass;
  });
}

function startCountdownTicker() {
  if (countdownTicker) return;
  countdownTicker = setInterval(updateAllCountdowns, 1000);
  updateAllCountdowns();
}

function setAuthTab(tab) {
  $('#tabLogin').classList.toggle('active', tab === 'login');
  $('#tabRegister').classList.toggle('active', tab === 'register');
  $('#authLoginForm').style.display = tab === 'login' ? 'block' : 'none';
  $('#authRegisterForm').style.display = tab === 'register' ? 'block' : 'none';
}

function directLogin() {
  const mobile = $('#loginMobile').value.trim();
  const pwd = $('#loginPassword').value;
  if (!/^[6-9]\d{9}$/.test(mobile)) return toast('Enter a valid 10-digit mobile number', 'bad');
  if (pwd.length < 4) return toast('Password must be at least 4 characters', 'bad');
  const user = DB.users.find(u => u.mobile === mobile);
  if (!user) return toast('No account found. Please register.', 'bad');
  if (user.blocked) return toast('This account is blocked.', 'bad');
  if (user.passwordHash !== hashPassword(pwd)) return toast('Incorrect password.', 'bad');

  session = { userId: user.id };
  saveSession();
  toast('Welcome back, ' + user.name.split(' ')[0] + '!', 'ok');

  if (user.role === 'admin') go('admin');
  else go('home');
}

function directRegister() {
  const name = $('#regName').value.trim();
  const game = $('#regGame').value.trim();
  const ffUid = $('#regUid').value.trim();
  const mobile = $('#regMobile').value.trim();
  const pwd = $('#regPassword').value;
  const pwd2 = $('#regPassword2').value;

  if (name.length < 2) return toast('Please enter your full name', 'bad');
  if (game.length < 2) return toast('Please enter your Free Fire game name', 'bad');
  if (!/^\d{6,12}$/.test(ffUid)) return toast('Free Fire UID must be 6-12 digits', 'bad');
  if (!/^[6-9]\d{9}$/.test(mobile)) return toast('Enter a valid 10-digit Indian mobile number', 'bad');
  if (mobile === ADMIN_MOBILE) return toast('This mobile number is reserved for admin.', 'bad');
  if (pwd.length < 4) return toast('Password must be at least 4 characters', 'bad');
  if (pwd !== pwd2) return toast('Passwords do not match', 'bad');
  if (DB.users.some(u => u.mobile === mobile)) return toast('Mobile already registered.', 'bad');
  if (DB.users.some(u => u.ffUid === ffUid)) return toast('Free Fire UID already registered.', 'bad');

  const user = {
    id: uid('u'), name, gameName: game, ffUid, mobile,
    passwordHash: hashPassword(pwd), passwordPlain: pwd,
    photo: '', matches: 0, wins: 0, points: 0, kills: 0,
    availCoins: 0, winCoins: 0, blocked: false, role: 'player', createdAt: nowISO()
  };
  DB.users.push(user);
  logAdmin('New player registered: ' + user.gameName);
  session = { userId: user.id };
  saveDB(); saveSession();
  toast('Account created successfully!', 'ok');
  go('home');
}

  openModal(

  const message =
    'Hello Admin 👋\n\n' +
    '📱 App: Free Fire India Tournament\n' +
    '👤 Name: ' + name + '\n' +
    '🎮 FF UID: ' + ffUid + '\n\n' +

   ============================================================ */
const NAV_ITEMS = [
  { key: 'home', label: 'HOME', icon: 'home' },
  { key: 'tournaments', label: 'ARENA', icon: 'trophy' },
  { key: 'wallet', label: 'WALLET', icon: 'wallet' },
  { key: 'matches', label: 'MATCHES', icon: 'target' },
  { key: 'profile', label: 'PROFILE', icon: 'user' }
];

function buildNav() {
  $('#navInner').innerHTML = NAV_ITEMS.map(n =>
    '<button class="nav-item" data-nav="' + n.key + '" onclick="go(\'' + n.key + '\')">' +
    icon(n.icon, 24) + '<span>' + n.label + '</span></button>'
  ).join('');
}

function go(view, param) {
  if (!currentUser() && view !== 'auth') view = 'auth';

  const user = currentUser();
  if (view === 'admin' && (!user || user.role !== 'admin')) {
    toast('Access Denied. Admin only.', 'bad');
    view = 'home';
  }

  state.view = view;
  state.param = param || null;

  renderView(view);

  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));

  const isAuth = view === 'auth';
  const isAdmin = view === 'admin';
  $('#appHeader').style.display = isAuth ? 'none' : 'block';
  $('#bottomNav').style.display = (isAuth || isAdmin) ? 'none' : 'block';
  $('#contactFab').style.display = isAdmin ? 'none' : 'grid';

  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.nav === view));

  updateHeader();
  updateAllCountdowns();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateHeader() {
  const u = currentUser();
  if (!u) return;
  $('#hdrAvatar').innerHTML = avatarHTML(u, 38);
}

function renderView(view) {
  switch (view) {
    case 'home': renderHome(); break;
    case 'tournaments': renderTournaments(); break;
    case 'details': renderDetails(); break;
    case 'matches': renderMatches(); break;
    case 'wallet': renderWallet(); break;
    case 'history': renderHistory(); break;
    case 'leaderboard': renderLeaderboard(); break;
    case 'profile': renderProfile(); break;
    case 'admin': renderAdmin(); break;
  }
}

function avatarHTML(user, size) {
  size = size || 44;
  if (user && user.photo) {
    return '<img class="avatar" style="width:' + size + 'px;height:' + size + 'px" src="' + user.photo + '" alt="Profile">';
  }
  const nm = (user && user.name ? user.name : 'G').trim();
  const initials = nm.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  return '<div class="avatar avatar-txt" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.36) + 'px">' + esc(initials) + '</div>';
}
function myRegistrations() {
  const u = currentUser();
  if (!u) return [];
  return DB.registrations.filter(r => r.userId === u.id);
}
function isRegistered(tid) {
  return myRegistrations().some(r => r.tournamentId === tid);
}
function tournamentById(id) { return DB.tournaments.find(t => t.id === id); }
function statusChip(status) {
  const map = { Upcoming: 'chip-blue', Live: 'chip-red', Completed: 'chip-green' };
  return '<span class="chip ' + (map[status] || 'chip-gray') + '">' + esc(status) + '</span>';
}
function roomVisible(t) {
  if (!t.roomId || !isRegistered(t.id)) return false;
  if (t.roomPublishAt) {
    const when = new Date(t.roomPublishAt).getTime();
    if (!isNaN(when) && Date.now() < when) return false;
  }
  return true;
}

function renderTournaments() {
  const filters = ['All', 'Solo', 'Duo', 'Squad', 'Free', 'Paid', 'Live'];
  let list = DB.tournaments.slice();
  const f = state.tFilter;
  if (f === 'Solo' || f === 'Duo' || f === 'Squad') list = list.filter(t => t.mode === f);
  else if (f === 'Free') list = list.filter(t => t.entryType === 'Free');
  else if (f === 'Paid') list = list.filter(t => t.entryType === 'Paid');
  else if (f === 'Live') list = list.filter(t => t.status === 'Live');

  list.sort((a, b) => {
    const order = { Live: 0, Upcoming: 1, Completed: 2 };
    if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
    return new Date(a.date + 'T' + a.time) - new Date(b.date + 'T' + b.time);
  });

  let html = '<div class="sec-head" style="margin-top:2px"><div class="sec-title">' + icon('trophy', 20) + ' TOURNAMENTS</div>' +
    '<span class="chip chip-blue">' + list.length + ' EVENTS</span></div>';

  html += '<div class="admin-tabs">' + filters.map(x =>
    '<button class="atab ' + (state.tFilter === x ? 'active' : '') + '" onclick="setTournamentFilter(\'' + x + '\')">' + x + '</button>'
  ).join('') + '</div>';

  html += list.length ? list.map(tournamentCardHTML).join('')
    : emptyHTML('trophy', 'No tournaments found', 'Try a different filter.');

  $('#view-tournaments').innerHTML = html;
  updateAllCountdowns();
}
function setTournamentFilter(f) {
  state.tFilter = f;
  renderTournaments();
}

/* ============================================================
   JOIN
   ============================================================ */
function joinTournament(id) {
  const u = currentUser();
  const t = tournamentById(id);
  if (!u || !t) return;
  if (u.blocked) return toast('Your account is blocked.', 'bad');
  if (t.status === 'Completed') return toast('This tournament is completed', 'bad');
  if (isRegistered(t.id)) return toast('Already joined', 'bad');
  if (t.joined >= t.slots) return toast('All slots are full', 'bad');

  const fee = t.entryType === 'Paid' ? (t.entryFee || 0) : 0;
  if (fee > 0 && u.availCoins < fee) return toast('Insufficient balance. Need ₹' + fee, 'bad');

  const msg = fee > 0
    ? 'Joining "' + t.name + '" will deduct ₹' + fee + ' from your wallet. Join করার পর বাতিল করা যাবে না।'
    : 'You are joining "' + t.name + '" on ' + fmtDate(t.date) + ' at ' + fmtTime(t.time) + '. Entry is free.';

  confirmAction('Join Tournament?', msg, () => {
    if (fee > 0 && u.availCoins < fee) return toast('Insufficient balance.', 'bad');

    if (fee > 0) {
      u.availCoins -= fee;
      DB.walletTransactions.unshift({
        id: uid('w'), userId: u.id, type: 'Entry Fee',
        title: 'Entry fee — ' + t.name, amount: fee,
        status: 'Completed', time: nowISO()
      });
    }

    DB.registrations.push({
      id: uid('r'), tournamentId: t.id, userId: u.id,
      playerName: u.name, gameName: u.gameName, ffUid: u.ffUid,
      status: 'Confirmed', createdAt: nowISO()
    });
    t.joined = Math.min(t.slots, t.joined + 1);

    logAdmin('Player ' + u.gameName + ' joined ' + t.name);
    saveDB();
    toast('Joined successfully!', 'ok');
    if (state.view === 'details') renderDetails();
    else if (state.view === 'home') renderHome();
    else if (state.view === 'tournaments') renderTournaments();
    updateHeader();
  }, fee > 0 ? 'PAY ₹' + fee + ' & JOIN' : 'JOIN NOW');
}

/* ============================================================

   ============================================================ */
function openScreenshotUpload(tid) {
  const t = tournamentById(tid);
  if (!t) return;
  const u = currentUser();
  if (!u) return;
  if (!isRegistered(tid)) return toast('You are not registered for this tournament', 'bad');
  if (!screenshotWindowOpen(t)) return toast('Screenshot upload is not open yet', 'bad');

  openModal(
    '<div class="modal-head">📸 SUBMIT SCREENSHOT</div>' +
    '<div class="modal-body">Tournament: <b>' + esc(t.name) + '</b><br>Player: ' + esc(u.gameName) + '</div>' +
    '<div class="field mt12"><label class="label">Select Screenshot (JPG / PNG)</label>' +
    '<input type="file" accept="image/*" class="input" style="padding:10px" id="ssFile" onchange="previewScreenshot(this)"></div>' +
    '<div id="ssPreview"></div>' +
    '<div class="small muted mt8">Screenshot admin এর Gmail এ attachment সহ যাবে এবং Google Drive folder <b>FF India Tournament Screenshots</b> এ save হবে।</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-ghost" onclick="closeModal()">CANCEL</button>' +
      '<button class="btn btn-primary" onclick="doSubmitScreenshot(\'' + tid + '\')">SUBMIT</button>' +
    '</div>'
  );
}

function previewScreenshot(input) {
  const f = input.files && input.files[0];
  const box = document.getElementById('ssPreview');
  if (!f || !box) return;
  if (!/^image\//.test(f.type)) { box.innerHTML = ''; return toast('Image files only', 'bad'); }
  if (f.size > 12 * 1024 * 1024) { box.innerHTML = ''; return toast('Max 12MB', 'bad'); }
  const url = URL.createObjectURL(f);
  box.innerHTML = '<div class="ss-preview-box mt8"><img src="' + url + '" alt="Preview"></div>';
}

function doSubmitScreenshot(tid) {
  const input = document.getElementById('ssFile');
  const f = input && input.files && input.files[0];
  if (!f) return toast('Select a screenshot first', 'bad');

  const u = currentUser();
  const t = tournamentById(tid);
  if (!u || !t) return;

  const btn = document.querySelector('.modal-foot .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'PROCESSING...'; }

  toast('Compressing…', 'info');

  resizeImage(f, 1200, (base64) => {
    if (!base64) {
      if (btn) { btn.disabled = false; btn.textContent = 'SUBMIT'; }
      return toast('Could not read image', 'bad');
    }

    const filename = 'ff_' + (u.gameName || 'player').replace(/[^a-zA-Z0-9]/g, '') + '_' + Date.now() + '.jpg';

    DB.screenshots.unshift({
      id: uid('ss'),
      tournamentId: tid,
      userId: u.id,
      playerName: u.name,
      gameName: u.gameName,
      ffUid: u.ffUid,
      tournamentName: t.name,
      filename: filename,
      time: nowISO(),
      synced: false
    });
    saveDB();

    closeModal();
    toast('Uploading…', 'info');

    sendToWebhook({
      type: 'screenshot',
      playerName: u.name,
      gameName: u.gameName,
      ffUid: u.ffUid,
      tournamentName: t.name,
      filename: filename,
      image: base64
    }).then(r => {
      if (r.ok) {
        const rec = DB.screenshots.find(s => s.filename === filename);
        if (rec) rec.synced = true;
        saveDB();
        toast('✅ Screenshot পাঠানো হয়েছে (Gmail + Drive)', 'ok');
      } else if (r.reason === 'not_configured') {
        toast('⚠ Webhook not configured', 'info');
      } else {
        toast('⚠ Upload failed — try again', 'bad');
      }
      if (state.view === 'details' && state.param === tid) renderDetails();
      else if (state.view === 'matches') renderMatches();
      else if (state.view === 'admin' && state.adminTab === 'screenshots') renderAdmin();
    });
  });
}

function setWdTab(tab) {
  $('#wdTabUpi').classList.toggle('active', tab === 'upi');
  $('#wdTabBank').classList.toggle('active', tab === 'bank');
  $('#wdUpiFields').style.display = tab === 'upi' ? 'block' : 'none';
  $('#wdBankFields').style.display = tab === 'bank' ? 'block' : 'none';
}

function submitWithdrawal() {
  const u = currentUser();
  if (!u) return;
  const amt = parseInt($('#wdAmount').value, 10);
  const method = $('#wdTabBank').classList.contains('active') ? 'bank' : 'upi';

  if (!amt || amt < 10) return toast('Minimum withdrawal is ₹10', 'bad');
  if (amt > u.availCoins) return toast('Insufficient balance', 'bad');

  let reqData, title, methodLabel;

  if (method === 'upi') {
    const upi = $('#wdUpi').value.trim();
    if (!upi || upi.indexOf('@') === -1) return toast('Enter a valid UPI ID', 'bad');
    reqData = { withdrawMethod: 'upi', upiId: upi };
    title = 'Withdrawal to UPI ' + upi;
    methodLabel = 'UPI';
  } else {
    const accNo = $('#wdAccNo').value.trim();
    const ifsc = $('#wdIfsc').value.trim().toUpperCase();
    const bankName = $('#wdBankName').value.trim();
    if (!accNo || accNo.length < 6) return toast('Enter a valid bank account (min 6 digits)', 'bad');
    if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)) return toast('Enter a valid IFSC code', 'bad');
    if (!bankName || bankName.length < 2) return toast('Enter your bank name', 'bad');
    reqData = { withdrawMethod: 'bank', bankAccNo: accNo, bankIfsc: ifsc, bankName: bankName };
    title = 'Withdrawal to ' + bankName + ' (A/C: ' + accNo.slice(-4) + ')';
    methodLabel = 'Bank';
  }

  const req = Object.assign({
    id: uid('pr'), userId: u.id, type: 'Withdrawal', amount: amt,
    status: 'Processing', createdAt: nowISO(), processedAt: '', adminNote: ''
  }, reqData);

  DB.paymentRequests.unshift(req);
  DB.walletTransactions.unshift({
    id: uid('w'), userId: u.id, type: 'Withdrawal', title: title,
    amount: amt, status: 'Processing', time: nowISO(), requestId: req.id,
    withdrawMethod: method
  });
  logAdmin('Withdrawal request: ₹' + amt + ' via ' + methodLabel + ' from ' + u.gameName);
  saveDB();
  closeModal();
  toast('Withdrawal request submitted ✅', 'ok');

  sendToWebhook({
    type: 'withdrawal',
    amount: amt,
    method: method,
    upiId: reqData.upiId || '',
    bankDetails: reqData.withdrawMethod === 'bank'
      ? { bankAccNo: reqData.bankAccNo, bankIfsc: reqData.bankIfsc, bankName: reqData.bankName }
      : null,
    userName: u.name,
    gameName: u.gameName,
    ffUid: u.ffUid,
    mobile: u.mobile
  }).then(r => {
    if (r.ok) toast('Admin কে email পাঠানো হয়েছে ✅', 'ok');
    else if (r.reason === 'not_configured') toast('⚠ Webhook setup required', 'info');
  });

  renderWallet();
  updateHeader();
}

function onPhotoPick(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)) return toast('Please select an image file', 'bad');
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const size = 180;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      const m = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      const u = currentUser();
      u.photo = c.toDataURL('image/jpeg', 0.72);
      saveDB();
      toast('Photo updated', 'ok');
      renderProfile();
      updateHeader();
    };
    img.onerror = () => toast('Could not read image', 'bad');
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

function saveProfile() {
  const u = currentUser();
  const name = $('#pfName').value.trim();
  const game = $('#pfGame').value.trim();
  const ffUid = $('#pfUid').value.trim();
  if (name.length < 2) return toast('Name must be at least 2 characters', 'bad');
  if (game.length < 2) return toast('Game name must be at least 2 characters', 'bad');
  if (!/^\d{6,12}$/.test(ffUid)) return toast('Free Fire UID must be 6-12 digits', 'bad');
  if (DB.users.some(x => x.id !== u.id && x.ffUid === ffUid)) return toast('That Free Fire UID is used by another player', 'bad');
  u.name = name; u.gameName = game; u.ffUid = ffUid;
  saveDB();
  toast('Profile saved', 'ok');
  renderProfile();
  updateHeader();
}

function adminSaveTournament(id) {
  const name = $('#tName').value.trim();
  const mode = $('#tMode').value;
  const date = $('#tDate').value;
  const time = $('#tTime').value;
  const map = $('#tMap').value;
  const slots = parseInt($('#tSlots').value, 10);
  const entryType = $('#tEntry').value;
  const fee = parseInt($('#tFee').value, 10) || 0;
  const prize = $('#tPrize').value.trim() || 'Prize TBA';
  const prize1 = $('#tPrize1').value.trim();
  const prize2 = $('#tPrize2').value.trim();
  const killRate = parseInt($('#tKillRate').value, 10) || 0;
  const rules = $('#tRules').value.trim() || DEFAULT_RULES;

  if (name.length < 3) return toast('Tournament name is too short', 'bad');
  if (!date) return toast('Please select a date', 'bad');
  if (!time) return toast('Please select a time', 'bad');
  if (!slots || slots < 2) return toast('Slots must be at least 2', 'bad');
  if (entryType === 'Paid' && fee < 1) return toast('Paid tournament needs an entry fee', 'bad');

  if (id) {
    const t = tournamentById(id);
    Object.assign(t, { name, mode, date, time, map, slots, entryType, entryFee: fee, prize, prize1, prize2, killRate, rules });
    logAdmin('Updated tournament: ' + name);
    toast('Tournament updated', 'ok');
  } else {
    DB.tournaments.unshift({
      id: uid('t'), name, mode, date, time, map, slots, joined: 0, prize, prize1, prize2, killRate,
      entryType, entryFee: fee, status: 'Upcoming', rules,
      roomId: '', roomPass: '', roomPublishAt: ''
    });
    logAdmin('Created tournament: ' + name);
    toast('Tournament created', 'ok');
  }
  saveDB();
  closeModal();
  renderAdmin();
  updateAllCountdowns();
}

function resultPlayerListHTML() {
  const tid = state.resTourId;
  if (!tid) return '<div class="empty" style="padding:18px"><div class="empty-s">Select a tournament above.</div></div>';
  const t = tournamentById(tid);
  if (!t) return '';
  const rate = t.killRate || 0;

  if (!state.resultDraft.length) return '<div class="empty" style="padding:18px"><div class="empty-s">No players registered.</div></div>';

  const hasExisting = DB.results.some(r => r.tournamentId === tid);
  let html = '';
  if (hasExisting) html += '<div class="notice notice-bad" style="margin-bottom:10px">⚠️ Results already published. Publishing again will double-pay.</div>';
  html += '<div class="notice notice-info" style="margin-bottom:10px">🎯 Kill Rate: ₹' + rate + '/kill</div>';

  html += '<table class="mini-table"><thead><tr><th>Player</th><th style="width:56px">K</th><th style="width:56px">P</th><th style="width:70px">Pay</th></tr></thead><tbody>';

  state.resultDraft.forEach((d, i) => {
    const payment = d.kills * rate;
    html += '<tr>' +
      '<td><div class="list-title" style="font-size:13px">' + esc(d.gameName) + '</div><div class="list-sub" style="font-size:11px">UID ' + esc(d.ffUid) + '</div></td>' +
      '<td><input class="input" style="padding:5px;text-align:center;" id="kills_' + i + '" type="number" min="0" max="999" value="' + d.kills + '" oninput="updateDraftKills(' + i + ', this.value)"></td>' +
      '<td><input class="input" style="padding:5px;text-align:center;" id="pts_' + i + '" type="number" min="0" max="999" value="' + d.placementPoints + '" oninput="updateDraftPoints(' + i + ', this.value)"></td>' +
      '<td><div class="bold" id="pay_' + i + '" style="color:var(--ok);font-size:14px">₹' + payment + '</div></td>' +
    '</tr>';
  });

  html += '</tbody></table>';

  const totalKills = state.resultDraft.reduce((s, d) => s + d.kills, 0);
  const totalPayment = state.resultDraft.reduce((s, d) => s + d.kills * rate, 0);
  const anyKills = state.resultDraft.some(d => d.kills > 0);

  html += '<div class="card" style="margin-top:10px;padding:14px;background:linear-gradient(145deg,#2a2a55,#12122e);border:1px solid var(--border)">' +
    '<div class="between" style="margin-bottom:6px"><span class="bold">Total Kills</span><span class="bold" id="totalKills" style="color:var(--secondary)">' + totalKills + '</span></div>' +
    '<div class="between"><span class="bold">Total Payout</span><span class="bold" id="totalPayment" style="color:var(--ok);font-size:18px">₹' + totalPayment + '</span></div>' +
  '</div>';

  html += '<button class="btn btn-primary btn-block mt12" id="publishBtn" onclick="adminPublishResults2()"' + (anyKills ? '' : ' disabled') + '>' +
    (anyKills ? 'PUBLISH & PAY ₹' + totalPayment : 'ENTER KILLS TO PUBLISH') +
  '</button>';

  return html;
}

function updateDraftKills(i, val) {
  const d = state.resultDraft[i];
  if (!d) return;
  d.kills = Math.max(0, Math.min(999, parseInt(val, 10) || 0));
  const t = tournamentById(state.resTourId);
  const rate = t ? (t.killRate || 0) : 0;
  const payEl = document.getElementById('pay_' + i);
  if (payEl) payEl.textContent = '₹' + (d.kills * rate);
  updateResultTotals();
}

function updateDraftPoints(i, val) {
  const d = state.resultDraft[i];
  if (!d) return;
  d.placementPoints = Math.max(0, Math.min(999, parseInt(val, 10) || 0));
}

function updateResultTotals() {
  const t = tournamentById(state.resTourId);
  const rate = t ? (t.killRate || 0) : 0;
  let totalKills = 0, totalPayment = 0;
  state.resultDraft.forEach(d => { totalKills += d.kills; totalPayment += d.kills * rate; });
  const el1 = document.getElementById('totalKills');
  if (el1) el1.textContent = totalKills;
  const el2 = document.getElementById('totalPayment');
  if (el2) el2.textContent = '₹' + totalPayment;
  const btn = document.getElementById('publishBtn');
  if (btn) {
    const anyKills = state.resultDraft.some(d => d.kills > 0);
    btn.disabled = !anyKills;
    btn.innerHTML = anyKills ? 'PUBLISH & PAY ₹' + totalPayment : 'ENTER KILLS TO PUBLISH';
  }
}

function adminPublishResults2() {
  const tid = state.resTourId;
  if (!tid) return toast('Select a tournament first', 'bad');
  if (!state.resultDraft.length) return toast('No players', 'bad');

  const t = tournamentById(tid);
  if (!t) return;
  const rate = t.killRate || 0;
  const totalKills = state.resultDraft.reduce((s, d) => s + d.kills, 0);
  const totalPayment = state.resultDraft.reduce((s, d) => s + d.kills * rate, 0);

  if (totalKills === 0) return toast('Enter kills', 'bad');

  const existing = DB.results.find(r => r.tournamentId === tid);
  const msg = (existing ? '⚠️ Results already exist. This will double-pay. ' : '') +
    'Total kills: ' + totalKills + ' × ₹' + rate + ' = ₹' + totalPayment + '. Proceed?';

  confirmAction(existing ? 'Re-publish?' : 'Publish Results?', msg, () => {
    const sorted = state.resultDraft.slice().sort((a, b) => (b.kills + b.placementPoints) - (a.kills + a.placementPoints));

    const entries = sorted.map((d, i) => ({
      gameName: d.gameName, ffUid: d.ffUid, kills: d.kills, placement: i + 1,
      placementPoints: d.placementPoints, total: d.kills + d.placementPoints, payment: d.kills * rate
    }));

    DB.results.unshift({
      id: uid('res'), tournamentId: tid, publishedAt: nowISO(),
      entries, killRate: rate, totalPayment, totalKills
    });

    entries.forEach(e => {
      let row = DB.leaderboard.find(p => p.ffUid === e.ffUid);
      if (!row) {
        row = { name: e.gameName, gameName: e.gameName, ffUid: e.ffUid, kills: 0, wins: 0, points: 0 };
        DB.leaderboard.push(row);
      }
      row.kills += e.kills;
      row.points += e.total;
      if (e.placement === 1) row.wins += 1;

      const u = DB.users.find(x => x.ffUid === e.ffUid);
      if (u) {
        u.matches += 1; u.kills += e.kills; u.points += e.total;
        if (e.placement === 1) u.wins += 1;
        if (e.payment > 0) {
          u.availCoins += e.payment;
          u.winCoins += e.payment;
          DB.walletTransactions.unshift({ id: uid('w'), userId: u.id, type: 'Winning', title: 'Kill reward — ' + t.name, amount: e.payment, status: 'Completed', time: nowISO() });
        }
      }
    });

    t.status = 'Completed';
    logAdmin('Published results & paid ₹' + totalPayment + ' for ' + t.name);

    state.resultDraft = []; state.resTourId = ''; state.resultDraftTid = '';
    saveDB();
    renderAdmin();
    toast('Published! ₹' + totalPayment + ' paid.', 'ok');
  }, 'PUBLISH', !!existing);
}

function adminPlayers() {
  const q = state.playerQuery || '';
  let html = '<div class="card-wrapper"><div class="card">' +
    '<div class="between" style="margin-bottom:10px">' +
      '<div class="bold">REGISTERED PLAYERS</div>' +
      '<span class="chip chip-blue">TOTAL ' + DB.users.length + '</span>' +
    '</div>' +
    '<div class="field" style="margin-bottom:12px">' +
      '<input class="input" id="playerSearch" placeholder="🔍 Search by name, IGN, mobile..." value="' + esc(q) + '" oninput="setPlayerQuery(this.value)">' +
    '</div>' +
    '<div id="adminPlayerList">' + adminPlayerListHTML(q) + '</div>' +
  '</div></div>';
  return html;
}

function setPlayerQuery(v) {
  state.playerQuery = v;
  const el = $('#adminPlayerList');
  if (el) el.innerHTML = adminPlayerListHTML(v);
}

function adminPlayerListHTML(q) {
  q = (q || '').trim().toLowerCase();
  let users = DB.users.slice();
  if (q) {
    users = users.filter(u =>
      (u.name || '').toLowerCase().includes(q) ||
      (u.gameName || '').toLowerCase().includes(q) ||
      (u.mobile || '').includes(q) ||
      (u.ffUid || '').includes(q)
    );
  }
  if (!users.length) return '<div class="small muted">No players matched.</div>';
  return users.map(u =>
    '<div class="list-row" style="cursor:pointer" onclick="adminOpenPlayer(\'' + u.id + '\')">' +
      avatarHTML(u, 40) +
      '<div class="list-main">' +
        '<div class="list-title">' + esc(u.gameName) + (u.role === 'admin' ? ' (Admin)' : '') + '</div>' +
        '<div class="list-sub">' + esc(u.mobile) + ' · ₹' + u.availCoins + '</div>' +
      '</div>' +
      '<span class="chip chip-gray" style="flex:none">VIEW</span>' +
    '</div>'
  ).join('');
}

function adminOpenPlayer(id) {
  const u = DB.users.find(x => x.id === id);
  if (!u) return;
  const row = (k, v) => '<tr><td style="color:var(--text-muted);white-space:nowrap">' + esc(k) + '</td><td class="bold" style="text-align:right">' + v + '</td></tr>';
  openModal(
    '<div class="modal-head">PLAYER PROFILE</div>' +
    '<div class="flex" style="gap:12px;margin-bottom:14px">' +
      avatarHTML(u, 60) +
      '<div><div class="bold" style="font-size:18px">' + esc(u.name) + '</div><div class="small muted">' + esc(u.gameName) + '</div></div>' +
    '</div>' +
    '<table class="mini-table"><tbody>' +
      row('Mobile', esc(u.mobile)) +
      row('Password', u.passwordPlain ? esc(u.passwordPlain) : '<span class="muted">not stored</span>') +
      row('Wallet', '<span style="color:var(--primary)">₹' + u.availCoins + '</span>') +
      row('Status', u.blocked ? 'Blocked' : 'Active') +
    '</tbody></table>' +
    '<div class="divider"></div>' +
    '<div class="bold small" style="margin-bottom:8px">ADJUST WALLET</div>' +
    '<div class="field"><input class="input" id="adjAmt" type="number" min="1" placeholder="Amount"></div>' +
    '<div class="grid2">' +
      '<button class="btn btn-ok btn-sm" onclick="adminAdjustWallet(\'' + u.id + '\', 1)">+ ADD</button>' +
      '<button class="btn btn-danger btn-sm" onclick="adminAdjustWallet(\'' + u.id + '\', -1)">− DEDUCT</button>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-ghost" onclick="closeModal()">CLOSE</button>' +
      '<button class="btn ' + (u.blocked ? 'btn-ok' : 'btn-danger') + '" onclick="adminToggleBlock(\'' + u.id + '\');closeModal()">' + (u.blocked ? 'UNBLOCK' : 'BLOCK') + '</button>' +
    '</div>'
  );
}

function adminAdjustWallet(id, sign) {
  const u = DB.users.find(x => x.id === id);
  if (!u) return;
  const amt = parseInt($('#adjAmt').value, 10);
  if (!amt || amt <= 0) return toast('Enter amount', 'bad');
  if (sign < 0 && u.availCoins < amt) return toast('Insufficient balance', 'bad');
  u.availCoins += sign * amt;
  DB.walletTransactions.unshift({ id: uid('w'), userId: u.id, type: sign > 0 ? 'Deposit' : 'Withdrawal', title: sign > 0 ? 'Admin credit' : 'Admin deduction', amount: amt, status: 'Completed', time: nowISO() });
  logAdmin((sign > 0 ? 'Credited ₹' + amt + ' to ' : 'Deducted ₹' + amt + ' from ') + u.gameName);
  saveDB();
  toast('Done', 'ok');
  renderAdmin();
  adminOpenPlayer(id);
}

function adminToggleBlock(id) {
  const u = DB.users.find(x => x.id === id);
  if (!u || u.role === 'admin') return;
  u.blocked = !u.blocked;
  logAdmin((u.blocked ? 'Blocked' : 'Unblocked') + ' ' + u.gameName);
  saveDB(); renderAdmin();
  toast(u.blocked ? 'Blocked' : 'Unblocked', 'ok');
}

function adminContent() {
  let html = '<div class="card-wrapper"><div class="card"><div class="bold" style="margin-bottom:10px">ANNOUNCEMENTS</div>' +
    '<div class="field"><label class="label">Title</label><input class="input" id="anTitle" maxlength="60"></div>' +
    '<div class="field"><label class="label">Message</label><textarea class="input" id="anBody" maxlength="300" rows="3"></textarea></div>' +
    '<button class="btn btn-primary btn-block" onclick="adminAddAnnouncement()">PUBLISH</button>';
  html += '<div class="divider"></div>';
  html += DB.announcements.map(a => '<div class="list-row"><div class="list-main"><div class="list-title">' + esc(a.title) + '</div><div class="list-sub" style="white-space:normal">' + esc(a.body) + '</div></div><button class="btn btn-danger btn-sm" onclick="adminDeleteAnnouncement(\'' + a.id + '\')">' + icon('trash', 16) + '</button></div>').join('');
  html += '</div></div>';
  return html;
}

function adminAddAnnouncement() {
  const title = $('#anTitle').value.trim();
  const body = $('#anBody').value.trim();
  if (title.length < 3 || body.length < 3) return toast('Fill both fields', 'bad');
  DB.announcements.unshift({ id: uid('a'), title, body, time: nowISO() });
  saveDB(); renderAdmin(); toast('Published', 'ok');
}
function adminDeleteAnnouncement(id) {
  DB.announcements = DB.announcements.filter(a => a.id !== id);
  saveDB(); renderAdmin(); toast('Deleted', 'info');
}

function adminPayments() {
  const isOpen = (s) => s === 'Pending' || s === 'Processing';
  const open = DB.paymentRequests.filter(p => isOpen(p.status));

  let html = '<div class="card-wrapper"><div class="card"><div class="between" style="margin-bottom:10px">' +
    '<div class="bold">OPEN REQUESTS</div><span class="chip chip-orange">' + open.length + '</span></div>';
  if (!open.length) {
    html += '<div class="small muted">No open requests.</div>';
  } else {
    html += open.map(p => {
      const u = DB.users.find(x => x.id === p.userId);
      return '<div class="list-row" style="align-items:flex-start">' +
        '<div style="width:40px;height:40px;background:linear-gradient(145deg,#2a2a55,#12122e);display:grid;place-items:center;color:var(--primary);border:1px solid var(--border);flex:none;border-radius:10px;">' + icon('wallet', 18) + '</div>' +
        '<div class="list-main">' +
          '<div class="list-title">' + p.type + ' ₹' + p.amount + '</div>' +
          '<div class="list-sub">' + esc(u ? u.gameName : 'Unknown') + '</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:6px;flex:none">' +
          '<button class="btn btn-ok btn-sm" onclick="adminPaymentAction(\'' + p.id + '\', \'Approved\')">APPROVE</button>' +
          '<button class="btn btn-danger btn-sm" onclick="adminPaymentAction(\'' + p.id + '\', \'Rejected\')">REJECT</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  html += '</div></div>';
  return html;
}

function adminPaymentAction(id, action) {
  const p = DB.paymentRequests.find(x => x.id === id);
  if (!p) return;
  const u = DB.users.find(x => x.id === p.userId);
  const isApprove = action === 'Approved';

  if (isApprove) {
    if (p.type === 'Deposit') {
      u.availCoins += p.amount;
      p.status = 'Approved';
      const tx = DB.walletTransactions.find(t => t.requestId === p.id);
      if (tx) tx.status = 'Completed';
    } else {
      u.availCoins -= p.amount;
      p.status = 'Approved';
      const tx = DB.walletTransactions.find(t => t.requestId === p.id);
      if (tx) tx.status = 'Completed';
    }
    toast('Approved', 'ok');
  } else {
    p.status = 'Rejected';
    const tx = DB.walletTransactions.find(t => t.requestId === p.id);
    if (tx) tx.status = 'Rejected';
    toast('Rejected', 'info');
  }
  saveDB(); renderAdmin(); updateHeader();
}

function adminWallet() {
  const pendingD = DB.paymentRequests.filter(p => (p.status === 'Pending' || p.status === 'Processing') && p.type === 'Deposit').length;
  const pendingW = DB.paymentRequests.filter(p => (p.status === 'Pending' || p.status === 'Processing') && p.type === 'Withdrawal').length;
  let html = '<div class="grid2">' +
    '<div class="stat-card"><div class="stat-v">' + pendingD + '</div><div class="stat-l">Pending Deposits</div></div>' +
    '<div class="stat-card"><div class="stat-v">' + pendingW + '</div><div class="stat-l">Pending Withdrawals</div></div>' +
  '</div>';
  html += '<div class="card-wrapper mt12"><div class="card"><div class="between" style="margin-bottom:8px">' +
    '<div class="bold">MANAGE PAYMENTS</div>' +
    '<button class="btn btn-primary btn-sm" onclick="setAdminTab(\'payments\')">GO</button></div></div></div>';
  return html;
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadDB();
  buildNav();

  ['loginMobile', 'loginPassword'].forEach(id => {
    const el = $('#' + id);
    if (el) el.addEventListener('keydown', e => {
      if (e.key === 'Enter') directLogin();
    });
  });
  ['regMobile', 'regPassword', 'regPassword2'].forEach(id => {
    const el = $('#' + id);
    if (el) el.addEventListener('keydown', e => {
      if (e.key === 'Enter') directRegister();
    });
  });

  const user = currentUser();
  if (user) {
    if (user.role === 'admin') go('admin');
    else go('home');
  } else {
    go('auth');
  }

  startCountdownTicker();
}

document.addEventListener('DOMContentLoaded', init);
if (document.readyState === 'interactive' || document.readyState === 'complete') init();
</script>
</body>
</html>
